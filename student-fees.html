<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Fees — CCS OrgHub Student</title>

  <link rel="icon" type="image/png" href="ccs.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found. Demo mode.')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
          colors: {
            purple: {
              950: '#0f041c', 900: '#1e0836', 850: '#2d0a4e', 800: '#3b0764',
              700: '#581c87', 600: '#7e22ce', 500: '#a855f7', 400: '#c084fc',
              300: '#d8b4fe', 200: '#e9d5ff', 100: '#f3e8ff', 50: '#faf5ff',
            }
          }
        }
      }
    }
  </script>
</head>

<body class="h-full font-sans antialiased selection:bg-purple-500 selection:text-white">

  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">
    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">

      <!-- CONNECTION STATUS -->
      <div id="connectionStatus" class="glass-card p-4 rounded-2xl flex items-center gap-3 text-xs">
        <div id="connIcon" class="p-2 rounded-xl bg-amber-500/20 border border-amber-500/30">
          <i data-lucide="wifi" class="w-4 h-4 text-amber-300"></i>
        </div>
        <div>
          <div id="connTitle" class="font-bold text-white">Loading your fees...</div>
          <div id="connSub" class="text-purple-300/70">Verifying database</div>
        </div>
      </div>

      <!-- STATS -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Total Fees</span>
            <div class="p-2.5 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/30"><i data-lucide="receipt" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-white" id="statTotal">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Total Paid</span>
            <div class="p-2.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
          </div>
          <div class="text-2xl font-extrabold text-emerald-300" id="statPaid">₱0.00</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Outstanding</span>
            <div class="p-2.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/30"><i data-lucide="clock" class="w-5 h-5"></i></div>
          </div>
          <div class="text-2xl font-extrabold text-amber-300" id="statUnpaid">₱0.00</div>
        </div>
      </div>

      <!-- TABLE -->
      <div class="glass-card p-6 rounded-3xl space-y-4">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="receipt" class="w-5 h-5 text-purple-400"></i> My Membership Fees
          </h3>
          <button onclick="loadFees()" class="px-3 py-1.5 rounded-lg bg-purple-950/60 hover:bg-purple-800/60 text-purple-200 border border-purple-500/30 text-[11px] font-bold transition-all flex items-center gap-1.5">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
          </button>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-purple-300/60"></i>
            <input id="feeSearch" oninput="renderFees()" placeholder="Search organization..."
              class="w-full bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white placeholder-purple-300/50 focus:border-purple-400 focus:outline-none" />
          </div>
          <select id="feeFilter" onchange="renderFees()"
            class="bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 px-3 text-xs text-white focus:border-purple-400 focus:outline-none">
            <option value="all">All Status</option>
            <option value="unpaid">Unpaid</option>
            <option value="paid">Paid</option>
          </select>
        </div>

        <div class="overflow-x-auto rounded-2xl border border-purple-500/20">
          <table class="w-full text-left text-xs">
            <thead class="bg-purple-950/80 text-purple-300 uppercase tracking-wider font-semibold border-b border-purple-500/20">
              <tr>
                <th class="py-3.5 px-4">Organization</th>
                <th class="py-3.5 px-4">Amount</th>
                <th class="py-3.5 px-4">Status</th>
                <th class="py-3.5 px-4">Due Date</th>
                <th class="py-3.5 px-4">Date Recorded</th>
              </tr>
            </thead>
            <tbody id="feesTable" class="divide-y divide-purple-500/10 text-purple-100">
              <tr><td colspan="5" class="py-8 text-center text-purple-300/60 italic">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    let fees = [];
    let currentProfile = null;

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar('fees', 'student');
      document.getElementById('topbar-layer').innerHTML = buildTopbar('My Fees', 'Track your membership fees');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      lucide.createIcons();
      initSupabase();
      await checkConnection();

      const ok = await guardAuth();
      if (!ok) return;

      await loadProfile();
      await loadFees();
    });

    async function checkConnection() {
      const iconEl = document.getElementById('connIcon');
      const titleEl = document.getElementById('connTitle');
      const subEl = document.getElementById('connSub');

      if (!window.supabaseClient) {
        iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
        iconEl.innerHTML = '<i data-lucide="wifi-off" class="w-4 h-4 text-red-300"></i>';
        titleEl.textContent = 'Supabase NOT connected';
        subEl.textContent = 'Check config.js';
        lucide.createIcons();
        return false;
      }

      try {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (!user) { titleEl.textContent = 'Not logged in'; return false; }

        iconEl.className = 'p-2 rounded-xl bg-emerald-500/20 border border-emerald-500/30';
        iconEl.innerHTML = '<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-300"></i>';
        titleEl.textContent = 'Connected as ' + user.email;
        subEl.textContent = 'Your fees are loaded below';
        lucide.createIcons();
        return true;
      } catch (err) {
        titleEl.textContent = 'Connection failed';
        subEl.textContent = err.message;
        return false;
      }
    }

    async function loadProfile() {
      try {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (!user) return;
        const { data } = await window.supabaseClient
          .from('profiles').select('*').eq('id', user.id).maybeSingle();
        currentProfile = data || { id: user.id, email: user.email, role: 'student' };
      } catch (e) { console.warn('Profile load failed:', e); }
    }

    async function findStudentNumericId() {
      if (!currentProfile?.student_id) return null;
      try {
        const { data } = await window.supabaseClient
          .from('students').select('id')
          .eq('student_id', currentProfile.student_id).maybeSingle();
        return data?.id || null;
      } catch { return null; }
    }

    async function loadFees() {
      const tbody = document.getElementById('feesTable');
      tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-purple-300/60 italic">Loading...</td></tr>`;

      if (!window.supabaseClient || !currentProfile) {
        fees = [];
        renderFees(); renderStats();
        return;
      }

      const studentId = await findStudentNumericId();
      if (!studentId) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-purple-300/60 italic">No student record linked. Contact admin.</td></tr>`;
        fees = [];
        renderStats();
        return;
      }

      try {
        const { data, error } = await window.supabaseClient
          .from('fees').select('*').eq('student_id', studentId)
          .order('created_at', { ascending: false });

        if (error) {
          tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-red-300 italic">Error: ${error.message}</td></tr>`;
          return;
        }

        fees = data || [];
        renderFees();
        renderStats();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-red-300 italic">Error: ${err.message}</td></tr>`;
      }
    }

    function renderStats() {
      const total = fees.length;
      const paid = fees.filter(f => f.status === 'paid').reduce((s, f) => s + (parseFloat(f.amount) || 0), 0);
      const unpaid = fees.filter(f => f.status === 'unpaid').reduce((s, f) => s + (parseFloat(f.amount) || 0), 0);

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statPaid').textContent = '₱' + paid.toFixed(2);
      document.getElementById('statUnpaid').textContent = '₱' + unpaid.toFixed(2);
    }

    function renderFees() {
      const q = (document.getElementById('feeSearch').value || '').toLowerCase();
      const filter = document.getElementById('feeFilter').value;

      const list = fees.filter(f => {
        if (filter !== 'all' && f.status !== filter) return false;
        if (q && !(f.org || '').toLowerCase().includes(q)) return false;
        return true;
      });

      const tbody = document.getElementById('feesTable');
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-purple-300/60 italic">No fee records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(f => `
        <tr class="hover:bg-purple-900/30 transition-colors">
          <td class="py-3.5 px-4 font-semibold text-white">${f.org || '—'}</td>
          <td class="py-3.5 px-4 text-purple-200 font-bold">₱${(parseFloat(f.amount) || 0).toFixed(2)}</td>
          <td class="py-3.5 px-4">
            <span class="px-2 py-1 rounded-full text-[10px] font-bold border
              ${f.status === 'paid' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30' : ''}
              ${f.status === 'unpaid' ? 'bg-amber-500/20 text-amber-300 border-amber-400/30' : ''}
              ${f.status === 'waived' ? 'bg-purple-500/20 text-purple-300 border-purple-400/30' : ''}">
              ${f.status || '—'}
            </span>
          </td>
          <td class="py-3.5 px-4 text-purple-300/80">${f.due_date ? new Date(f.due_date).toLocaleDateString() : '—'}</td>
          <td class="py-3.5 px-4 text-purple-300/80">${f.created_at ? new Date(f.created_at).toLocaleDateString() : '—'}</td>
        </tr>
      `).join('');
    }
  </script>

</body>
</html>
