<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Memberships — CCS OrgHub Student</title>

  <link rel="icon" type="image/png" href="ccs.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found. Demo mode.')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
        colors: { purple: {
          950:'#0f041c',900:'#1e0836',850:'#2d0a4e',800:'#3b0764',700:'#581c87',
          600:'#7e22ce',500:'#a855f7',400:'#c084fc',300:'#d8b4fe',200:'#e9d5ff',100:'#f3e8ff',50:'#faf5ff'
        }}
      }}
    }
  </script>
</head>

<body class="h-full font-sans antialiased selection:bg-purple-500 selection:text-white">

  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">
    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">

      <!-- CONNECTION STATUS -->
      <div id="connectionStatus" class="glass-card p-4 rounded-2xl flex items-center gap-3 text-xs">
        <div id="connIcon" class="p-2 rounded-xl bg-amber-500/20 border border-amber-500/30">
          <i data-lucide="wifi" class="w-4 h-4 text-amber-300"></i>
        </div>
        <div>
          <div id="connTitle" class="font-bold text-white">Loading your memberships...</div>
          <div id="connSub" class="text-purple-300/70">Verifying database</div>
        </div>
      </div>

      <!-- STATS -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Joined Orgs</span>
            <div class="p-2.5 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/30"><i data-lucide="building-2" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-white" id="statTotal">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Active</span>
            <div class="p-2.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-emerald-300" id="statActive">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Pending</span>
            <div class="p-2.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/30"><i data-lucide="clock" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-amber-300" id="statPending">—</div>
        </div>
      </div>

      <!-- MEMBERSHIPS LIST -->
      <div class="glass-card p-6 rounded-3xl space-y-4">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="user-check" class="w-5 h-5 text-purple-400"></i> My Organization Memberships
          </h3>
          <div class="flex items-center gap-2">
            <button onclick="loadMemberships()" class="px-3 py-1.5 rounded-lg bg-purple-950/60 hover:bg-purple-800/60 text-purple-200 border border-purple-500/30 text-[11px] font-bold transition-all flex items-center gap-1.5">
              <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
            </button>
            <a href="student-organizations.html" class="px-3 py-1.5 rounded-lg bg-purple-600 hover:bg-purple-500 text-white border border-purple-400/40 text-[11px] font-bold transition-all flex items-center gap-1.5">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> Join New Org
            </a>
          </div>
        </div>

        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-purple-300/60"></i>
          <input id="searchMemberships" oninput="renderMemberships()" placeholder="Search by organization..."
            class="w-full bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white placeholder-purple-300/50 focus:border-purple-400 focus:outline-none" />
        </div>

        <div id="membershipsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <p class="text-center text-purple-300/60 py-6 text-xs italic col-span-full">Loading...</p>
        </div>
      </div>

    </main>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    let memberships = [];
    let currentProfile = null;

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar('memberships', 'student');
      document.getElementById('topbar-layer').innerHTML = buildTopbar('My Memberships', 'View your organization memberships');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      lucide.createIcons();
      initSupabase();
      await checkConnection();

      const ok = await guardAuth();
      if (!ok) return;

      await loadProfile();
      await loadMemberships();
    });

    async function checkConnection() {
      const iconEl = document.getElementById('connIcon');
      const titleEl = document.getElementById('connTitle');
      const subEl = document.getElementById('connSub');

      if (!window.supabaseClient) {
        iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
        iconEl.innerHTML = '<i data-lucide="wifi-off" class="w-4 h-4 text-red-300"></i>';
        titleEl.textContent = 'Supabase NOT connected';
        subEl.textContent = 'Check config.js';
        lucide.createIcons();
        return false;
      }

      try {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (!user) { titleEl.textContent = 'Not logged in'; return false; }

        iconEl.className = 'p-2 rounded-xl bg-emerald-500/20 border border-emerald-500/30';
        iconEl.innerHTML = '<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-300"></i>';
        titleEl.textContent = 'Connected as ' + user.email;
        subEl.textContent = 'Your memberships are loaded below';
        lucide.createIcons();
        return true;
      } catch (err) {
        titleEl.textContent = 'Connection failed';
        subEl.textContent = err.message;
        return false;
      }
    }

    async function loadProfile() {
      try {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (!user) return;
        const { data } = await window.supabaseClient
          .from('profiles').select('*').eq('id', user.id).maybeSingle();
        currentProfile = data || { id: user.id, email: user.email, role: 'student' };
      } catch (e) { console.warn('Profile load failed:', e); }
    }

    async function loadMemberships() {
      const grid = document.getElementById('membershipsGrid');
      grid.innerHTML = `<p class="text-center text-purple-300/60 py-6 text-xs italic col-span-full">Loading...</p>`;

      if (!window.supabaseClient || !currentProfile) {
        memberships = [];
        renderMemberships(); renderStats();
        return;
      }

      try {
        const { data, error } = await window.supabaseClient
          .from('memberships')
          .select('*')
          .eq('student_id', currentProfile.id)
          .order('created_at', { ascending: false });

        if (error) {
          grid.innerHTML = `<p class="text-center text-red-300 py-6 text-xs italic col-span-full">Error: ${error.message}</p>`;
          return;
        }

        memberships = data || [];
        renderMemberships();
        renderStats();
      } catch (err) {
        grid.innerHTML = `<p class="text-center text-red-300 py-6 text-xs italic col-span-full">Error: ${err.message}</p>`;
      }
    }

    function renderStats() {
      document.getElementById('statTotal').textContent = memberships.length;
      document.getElementById('statActive').textContent = memberships.filter(m => m.status === 'active').length;
      document.getElementById('statPending').textContent = memberships.filter(m => m.status === 'pending').length;
    }

    function renderMemberships() {
      const q = (document.getElementById('searchMemberships').value || '').toLowerCase();
      const grid = document.getElementById('membershipsGrid');

      const list = memberships.filter(m => 
        !q || (m.org || '').toLowerCase().includes(q)
      );

      if (list.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12">
            <div class="w-16 h-16 mx-auto rounded-full bg-purple-600/20 border border-purple-500/40 flex items-center justify-center text-purple-300 mb-3">
              <i data-lucide="building-2" class="w-8 h-8"></i>
            </div>
            <p class="text-purple-300/60 text-sm">You haven't joined any organizations yet.</p>
            <a href="student-organizations.html" class="inline-block mt-4 px-5 py-2.5 rounded-xl bg-purple-600 text-white font-bold text-xs hover:bg-purple-500 transition-all">Browse Organizations</a>
          </div>`;
        lucide.createIcons();
        return;
      }

      const statusColor = {
        active: 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30',
        pending: 'bg-amber-500/20 text-amber-300 border-amber-400/30',
        inactive: 'bg-red-500/20 text-red-300 border-red-400/30',
      };

      grid.innerHTML = list.map(m => `
        <div class="p-5 rounded-2xl bg-purple-950/50 border border-purple-500/30 hover:border-purple-400/60 transition-all flex flex-col justify-between gap-4">
          <div>
            <div class="flex items-start justify-between gap-2 mb-2">
              <h4 class="font-bold text-white text-sm line-clamp-2">${m.org || 'Unknown Org'}</h4>
              <span class="shrink-0 px-2 py-1 rounded-full text-[10px] font-bold border ${statusColor[m.status] || ''} capitalize">
                ${m.status || '—'}
              </span>
            </div>
            <div class="flex items-center gap-2 mt-3">
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-purple-900/80 border border-purple-500/30 capitalize text-purple-200">
                ${m.role || 'Member'}
              </span>
            </div>
          </div>
          <div class="flex items-center justify-between border-t border-purple-500/20 pt-3">
            <span class="text-[10px] text-purple-300/60">Joined: ${m.created_at ? new Date(m.created_at).toLocaleDateString() : '—'}</span>
            ${m.status === 'active' ? `
              <button onclick="leaveOrg(${m.id})" class="text-[10px] text-red-400 hover:text-red-300 font-bold transition-colors">Leave Org</button>
            ` : ''}
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    async function leaveOrg(id) {
      if (!confirm('Are you sure you want to leave this organization?')) return;
      if (!window.supabaseClient) return;

      try {
        const { error } = await window.supabaseClient
          .from('memberships')
          .delete()
          .eq('id', id);

        if (error) {
          showToast('Action Failed ❌', error.message);
          return;
        }

        await loadMemberships();
        showToast('Left Organization', 'You have successfully left the organization.');
      } catch (err) {
        showToast('Action Failed', err.message);
      }
    }
  </script>

</body>
</html>
