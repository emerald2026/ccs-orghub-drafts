<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMCO Membership — CCS OrgHub</title>
  <link rel="icon" type="image/png" href="ccs.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
        colors: { purple: { 950:'#0f041c',900:'#1e0836',850:'#2d0a4e',800:'#3b0764',700:'#581c87',600:'#7e22ce',500:'#a855f7',400:'#c084fc',300:'#d8b4fe',200:'#e9d5ff',100:'#f3e8ff',50:'#faf5ff' }}
      }}
    }
  </script>
</head>
<body class="h-full font-sans antialiased selection:bg-fuchsia-500 selection:text-white flex overflow-hidden">
  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">
    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">
      <div class="glass-card p-6 rounded-3xl space-y-4">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <div>
            <h3 class="text-base font-bold text-white flex items-center gap-2">
              <i data-lucide="user-check" class="w-5 h-5 text-fuchsia-400"></i> EMCO Membership
            </h3>
            <p class="text-xs text-fuchsia-300/70">Manage active and pending memberships</p>
          </div>
          <button onclick="loadMemberships()" class="px-3 py-2.5 rounded-xl bg-fuchsia-950/60 hover:bg-fuchsia-800/60 text-fuchsia-200 border border-fuchsia-500/30 text-[11px] font-bold transition-all flex items-center gap-1.5">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh
          </button>
        </div>
        
        <div class="overflow-x-auto rounded-2xl border border-fuchsia-500/20">
          <table class="w-full text-left text-xs">
            <thead class="bg-fuchsia-950/80 text-fuchsia-300 uppercase tracking-wider font-semibold border-b border-fuchsia-500/20">
              <tr>
                <th class="py-3.5 px-4">Student Name</th>
                <th class="py-3.5 px-4">Role</th>
                <th class="py-3.5 px-4">Status</th>
                <th class="py-3.5 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="membershipTable" class="divide-y divide-fuchsia-500/10 text-fuchsia-100">
              <tr><td colspan="4" class="py-8 text-center text-fuchsia-300/60 italic">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    const ORG_CODE = 'EMCO';
    const ORG_LABEL = 'EMCO';
    const ACTIVE_PAGE = 'org-membership';

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar(ACTIVE_PAGE);
      document.getElementById('topbar-layer').innerHTML = buildTopbar('EMCO Membership', 'Manage member status');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      lucide.createIcons();
      initSupabase();
      
      const auth = await guardOrgAuth(ORG_CODE);
      if (!auth.ok) return;
      
      await loadMemberships();
    });

    async function loadMemberships() {
      if (!window.supabaseClient) return;
      const tbody = document.getElementById('membershipTable');
      
      try {
        const { data } = await window.supabaseClient
          .from('memberships')
          .select('*')
          .eq('org', ORG_LABEL)
          .order('created_at', { ascending: false });

        if (!data || data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-fuchsia-300/60 italic">No membership records found.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map(m => `
          <tr class="hover:bg-fuchsia-900/30 transition-colors">
            <td class="py-3.5 px-4 font-semibold text-white">${m.student_name || '—'}</td>
            <td class="py-3.5 px-4 text-fuchsia-200 capitalize">${m.role || 'Member'}</td>
            <td class="py-3.5 px-4"><span class="px-2 py-1 rounded-full text-[10px] font-bold border ${m.status === 'active' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30' : 'bg-amber-500/20 text-amber-300 border-amber-400/30'}">${m.status || 'pending'}</span></td>
            <td class="py-3.5 px-4 text-right">
              ${m.status !== 'active' ? `<button onclick="approveMember(${m.id})" class="px-2.5 py-1 rounded-lg bg-emerald-500/20 hover:bg-emerald-500 text-emerald-300 hover:text-white text-[10px] font-bold border border-emerald-500/30 transition-all">Approve</button>` : ''}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-red-300 italic">Error loading data.</td></tr>`;
      }
      lucide.createIcons();
    }

    window.approveMember = async (id) => {
      if (!window.supabaseClient) return;
      try {
        await window.supabaseClient.from('memberships').update({ status: 'active' }).eq('id', id);
        showToast('Approved', 'Member status updated to active.');
        await loadMemberships();
      } catch (err) { console.error(err); }
    };
  </script>
</body>
</html>
