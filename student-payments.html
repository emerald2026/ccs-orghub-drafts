<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment History — CCS OrgHub</title>

        <link rel="icon" type="image/png" href="ccs.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found. Demo mode.')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
          colors: {
            purple: {
              950: '#0f041c', 900: '#1e0836', 850: '#2d0a4e', 800: '#3b0764',
              700: '#581c87', 600: '#7e22ce', 500: '#a855f7', 400: '#c084fc',
              300: '#d8b4fe', 200: '#e9d5ff', 100: '#f3e8ff', 50: '#faf5ff',
            }
          }
        }
      }
    }
  </script>
</head>

<body class="h-full font-sans antialiased selection:bg-purple-500 selection:text-white flex overflow-hidden">

  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">

    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">

      <!-- CONNECTION STATUS -->
      <div id="connectionStatus" class="glass-card p-4 rounded-2xl flex items-center gap-3 text-xs">
        <div id="connIcon" class="p-2 rounded-xl bg-amber-500/20 border border-amber-500/30">
          <i data-lucide="wifi" class="w-4 h-4 text-amber-300"></i>
        </div>
        <div>
          <div id="connTitle" class="font-bold text-white">Checking Supabase connection...</div>
          <div id="connSub" class="text-purple-300/70">Verifying database access</div>
        </div>
      </div>

      <!-- STATS -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Total Paid</span>
            <div class="p-2.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
              <i data-lucide="check-circle-2" class="w-5 h-5"></i>
            </div>
          </div>
          <div class="text-3xl font-extrabold text-emerald-300" id="statPaid">₱0.00</div>
          <p class="text-xs text-emerald-400/80 mt-2 font-medium">Completed transactions</p>
        </div>

        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Unpaid</span>
            <div class="p-2.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/30">
              <i data-lucide="clock" class="w-5 h-5"></i>
            </div>
          </div>
          <div class="text-3xl font-extrabold text-amber-300" id="statUnpaid">₱0.00</div>
          <p class="text-xs text-amber-300/80 mt-2 font-medium">Requires payment</p>
        </div>

        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Transactions</span>
            <div class="p-2.5 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/30">
              <i data-lucide="list" class="w-5 h-5"></i>
            </div>
          </div>
          <div class="text-3xl font-extrabold text-white" id="statTotal">0</div>
          <p class="text-xs text-purple-300 mt-2 font-medium">All records</p>
        </div>
      </div>

      <!-- FILTERS -->
      <div class="glass-card p-5 rounded-3xl">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="sm:col-span-2 relative">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-purple-300/60"></i>
            <input id="searchPayments" oninput="renderPayments()" placeholder="Search payments..."
              class="w-full bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white placeholder-purple-300/50 focus:border-purple-400 focus:outline-none" />
          </div>
          <select id="filterType" onchange="renderPayments()"
            class="bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 px-3 text-xs text-white focus:border-purple-400 focus:outline-none">
            <option value="all">All Types</option>
            <option value="Fee">Fees Only</option>
            <option value="Fine">Fines Only</option>
          </select>
        </div>
      </div>

      <!-- PAYMENTS TABLE -->
      <div class="glass-card p-6 rounded-3xl space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="credit-card" class="w-5 h-5 text-purple-400"></i> Payment History
          </h3>
          <button onclick="refreshAll()" class="px-3 py-1.5 rounded-lg bg-purple-950/60 hover:bg-purple-800/60 text-purple-200 border border-purple-500/30 text-[11px] font-bold transition-all flex items-center gap-1.5">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
          </button>
        </div>

        <div class="overflow-x-auto rounded-2xl border border-purple-500/20">
          <table class="w-full text-left text-xs">
            <thead class="bg-purple-950/80 text-purple-300 uppercase tracking-wider font-semibold border-b border-purple-500/20">
              <tr>
                <th class="py-3.5 px-4">Type</th>
                <th class="py-3.5 px-4">Description</th>
                <th class="py-3.5 px-4">Amount</th>
                <th class="py-3.5 px-4">Date</th>
                <th class="py-3.5 px-4">Status</th>
              </tr>
            </thead>
            <tbody id="paymentsTable" class="divide-y divide-purple-500/10 text-purple-100">
              <tr><td colspan="5" class="py-8 text-center text-purple-300/60 italic">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    let currentProfile = null;
    let payments = [];

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar('payments', 'student');
      document.getElementById('topbar-layer').innerHTML = buildTopbar('Payment History', 'View all your fee and fine payments');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      lucide.createIcons();

      initSupabase();
      await checkConnection();

      const ok = await guardAuth();
      if (!ok) return;

      await loadProfile();
      await refreshAll();
    });

    /* ---------- CONNECTION CHECK ---------- */
    async function checkConnection() {
      const iconEl = document.getElementById('connIcon');
      const titleEl = document.getElementById('connTitle');
      const subEl = document.getElementById('connSub');

      if (!window.supabaseClient) {
        iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
        iconEl.innerHTML = '<i data-lucide="wifi-off" class="w-4 h-4 text-red-300"></i>';
        titleEl.textContent = 'Supabase NOT connected';
        subEl.textContent = 'Check config.js';
        lucide.createIcons();
        return false;
      }

      try {
        const { error } = await window.supabaseClient.from('fees').select('id').limit(1);
        if (error) {
          iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
          iconEl.innerHTML = '<i data-lucide="alert-circle" class="w-4 h-4 text-red-300"></i>';
          titleEl.textContent = 'Table error: ' + error.message;
          subEl.textContent = 'Check RLS or table name';
        } else {
          iconEl.className = 'p-2 rounded-xl bg-emerald-500/20 border border-emerald-500/30';
          iconEl.innerHTML = '<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-300"></i>';
          titleEl.textContent = 'Supabase connected ✅';
          subEl.textContent = 'Showing your live payments';
        }
        lucide.createIcons();
        return !error;
      } catch (err) {
        titleEl.textContent = 'Connection failed';
        subEl.textContent = err.message;
        return false;
      }
    }

    /* ---------- LOAD PROFILE ---------- */
    async function loadProfile() {
      if (!window.supabaseClient) return;

      const { data: { user } } = await window.supabaseClient.auth.getUser();
      if (!user) {
        window.location.replace('index.html');
        return;
      }

      const { data: profile } = await window.supabaseClient
        .from('profiles').select('*').eq('id', user.id).single();

      currentProfile = profile || null;
    }

    /* ---------- REFRESH ALL ---------- */
    async function refreshAll() {
      if (!currentProfile) return;
      await fetchPayments();
      renderPayments();
      renderStats();
    }

    /* ---------- FETCH PAYMENTS (Fees + Fines Combined) ---------- */
    async function fetchPayments() {
      payments = [];

      if (!window.supabaseClient || !currentProfile) return;

      // Load fees
      try {
        const { data: fees } = await window.supabaseClient
          .from('fees').select('*')
          .eq('student_id', currentProfile.id)
          .order('created_at', { ascending: false });

        (fees || []).forEach(f => payments.push({
          type: 'Fee',
          description: f.org || 'Membership Fee',
          amount: f.amount || 0,
          status: f.status === 'paid' ? 'paid' : 'unpaid',
          created_at: f.created_at
        }));
      } catch (e) { console.warn('Fees load failed:', e); }

      // Load fines
      try {
        const { data: fines } = await window.supabaseClient
          .from('fines').select('*')
          .eq('student_id', currentProfile.id)
          .order('created_at', { ascending: false });

        (fines || []).forEach(f => payments.push({
          type: 'Fine',
          description: f.reason || 'Fine',
          amount: f.amount || 0,
          status: f.status === 'settled' ? 'paid' : 'unpaid',
          created_at: f.created_at
        }));
      } catch (e) { console.warn('Fines load failed:', e); }

      // Sort by date descending
      payments.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    }

    /* ---------- STATS ---------- */
    function renderStats() {
      const paid = payments.filter(p => p.status === 'paid').reduce((s, p) => s + (p.amount || 0), 0);
      const unpaid = payments.filter(p => p.status === 'unpaid').reduce((s, p) => s + (p.amount || 0), 0);

      document.getElementById('statPaid').textContent = '₱' + paid.toFixed(2);
      document.getElementById('statUnpaid').textContent = '₱' + unpaid.toFixed(2);
      document.getElementById('statTotal').textContent = payments.length;
    }

    /* ---------- RENDER TABLE ---------- */
    function renderPayments() {
      const q = (document.getElementById('searchPayments').value || '').toLowerCase();
      const filter = document.getElementById('filterType').value;

      const list = payments.filter(p => {
        if (filter !== 'all' && p.type !== filter) return false;
        if (q && !(`${p.description}`).toLowerCase().includes(q)) return false;
        return true;
      });

      const tbody = document.getElementById('paymentsTable');

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-purple-300/60 italic">No payment records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(p => `
        <tr class="hover:bg-purple-900/30 transition-colors">
          <td class="py-3.5 px-4">
            <span class="px-2 py-1 rounded-full text-[10px] font-bold ${p.type === 'Fee' ? 'bg-purple-500/20 text-purple-300 border border-purple-400/30' : 'bg-red-500/20 text-red-300 border border-red-400/30'}">${p.type}</span>
          </td>
          <td class="py-3.5 px-4 text-white font-semibold">${p.description}</td>
          <td class="py-3.5 px-4 text-purple-200 font-bold">₱${(p.amount || 0).toFixed(2)}</td>
          <td class="py-3.5 px-4 text-purple-300/80">${p.created_at ? new Date(p.created_at).toLocaleDateString() : '—'}</td>
          <td class="py-3.5 px-4">
            <span class="px-2 py-1 rounded-full text-[10px] font-bold ${p.status === 'paid' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/30' : 'bg-amber-500/20 text-amber-300 border border-amber-400/30'}">${p.status}</span>
          </td>
        </tr>
      `).join('');
    }
  </script>

</body>
</html>
