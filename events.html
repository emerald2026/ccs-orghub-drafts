<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — CCS OrgHub Admin Panel</title>

        <link rel="icon" type="image/png" href="ccs.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found. Demo mode.')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
        colors: { purple: {
          950:'#0f041c',900:'#1e0836',850:'#2d0a4e',800:'#3b0764',
          700:'#581c87',600:'#7e22ce',500:'#a855f7',400:'#c084fc',
          300:'#d8b4fe',200:'#e9d5ff',100:'#f3e8ff',50:'#faf5ff'
        }}
      }}
    }
  </script>
</head>

<body class="h-full font-sans antialiased selection:bg-purple-500 selection:text-white flex overflow-hidden">

  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">
    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">

      <!-- CONNECTION STATUS -->
      <div id="connectionStatus" class="glass-card p-4 rounded-2xl flex items-center gap-3 text-xs">
        <div id="connIcon" class="p-2 rounded-xl bg-amber-500/20 border border-amber-500/30">
          <i data-lucide="wifi" class="w-4 h-4 text-amber-300"></i>
        </div>
        <div>
          <div id="connTitle" class="font-bold text-white">Checking Supabase connection...</div>
          <div id="connSub" class="text-purple-300/70">Verifying database access</div>
        </div>
      </div>

      <!-- STATS -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Total Events</span>
            <div class="p-2.5 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/30"><i data-lucide="calendar-days" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-white" id="eventStatTotal">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Upcoming</span>
            <div class="p-2.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"><i data-lucide="clock" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-emerald-300" id="eventStatUpcoming">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Completed</span>
            <div class="p-2.5 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/30"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-white" id="eventStatCompleted">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">This Month</span>
            <div class="p-2.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/30"><i data-lucide="sparkles" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-amber-300" id="eventStatMonth">—</div>
        </div>
      </div>

      <!-- EVENT LIST -->
      <div class="glass-card p-6 rounded-3xl">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4">
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="calendar-days" class="w-5 h-5 text-purple-400"></i> Events Directory
          </h3>
          <div class="flex items-center gap-2">
            <button onclick="loadEvents()" class="px-3 py-1.5 rounded-lg bg-purple-950/60 hover:bg-purple-800/60 text-purple-200 border border-purple-500/30 text-[11px] font-bold transition-all flex items-center gap-1.5">
              <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
            </button>
            <button onclick="openEventModal()" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-purple-500 to-purple-700 text-white font-bold text-xs shadow-lg shadow-purple-600/40 hover:brightness-110 flex items-center gap-2 border border-purple-400/40">
              <i data-lucide="plus" class="w-4 h-4"></i><span>Create Event</span>
            </button>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 mb-4">
          <div class="relative flex-1">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-purple-300/60"></i>
            <input id="eventSearch" oninput="renderEvents()" placeholder="Search title, org, venue..."
              class="w-full bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white placeholder-purple-300/50 focus:border-purple-400 focus:outline-none" />
          </div>
          <select id="eventFilter" onchange="renderEvents()"
            class="bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 px-3 text-xs text-white focus:border-purple-400 focus:outline-none">
            <option value="all">All Status</option>
            <option value="upcoming">Upcoming</option>
            <option value="ongoing">Ongoing</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>

        <div id="eventsList" class="space-y-3">
          <p class="text-center text-purple-300/60 py-6 text-xs italic">Loading events...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- EVENT MODAL -->
  <div id="modal-event" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="glass-card w-full max-w-lg rounded-3xl p-6 shadow-2xl border border-purple-400/40 space-y-5 relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal('modal-event')" class="absolute top-5 right-5 text-purple-300 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>

      <div class="flex items-center space-x-3">
        <div class="p-2.5 rounded-xl bg-purple-600/30 text-purple-300 border border-purple-400/40"><i data-lucide="calendar-plus" class="w-5 h-5"></i></div>
        <div>
          <h3 class="text-lg font-bold text-white">Create New Event</h3>
          <p class="text-xs text-purple-300/70">Fill in the event details</p>
        </div>
      </div>

      <form id="event-form" onsubmit="saveEvent(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-purple-200 mb-1">Event Title <span class="text-red-400">*</span></label>
          <input id="event-title" required maxlength="100" placeholder="e.g. CCS General Assembly"
            class="w-full bg-purple-950/80 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none" />
        </div>
        <div>
          <label class="block font-semibold text-purple-200 mb-1">Description</label>
          <textarea id="event-desc" rows="3" maxlength="300" placeholder="Briefly describe..."
            class="w-full bg-purple-950/80 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none resize-none"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-purple-200 mb-1">Organization</label>
            <input id="event-org" placeholder="e.g. CCS Student Council"
              class="w-full bg-purple-950/80 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none" />
          </div>
          <div>
            <label class="block font-semibold text-purple-200 mb-1">Venue</label>
            <input id="event-venue" placeholder="e.g. CCS Auditorium"
              class="w-full bg-purple-950/80 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-purple-200 mb-1">Date & Time <span class="text-red-400">*</span></label>
            <input id="event-date" type="datetime-local" required
              class="w-full bg-purple-950/80 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-white focus:border-purple-400 focus:outline-none" />
          </div>
          <div>
            <label class="block font-semibold text-purple-200 mb-1">Event Type</label>
            <select id="event-type"
              class="w-full bg-purple-950/80 border border-purple-500/40 rounded-xl px-3 py-2.5 text-white focus:border-purple-400 focus:outline-none">
              <option value="meeting">Meeting</option>
              <option value="seminar">Seminar</option>
              <option value="sports">Sports</option>
              <option value="community">Community Service</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block font-semibold text-purple-200 mb-1">Status</label>
          <select id="event-status"
            class="w-full bg-purple-950/80 border border-purple-500/40 rounded-xl px-3 py-2.5 text-white focus:border-purple-400 focus:outline-none">
            <option value="upcoming" selected>Upcoming</option>
            <option value="ongoing">Ongoing</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="pt-2 flex justify-end space-x-2">
          <button type="button" onclick="closeModal('modal-event')" class="px-4 py-2 rounded-xl bg-purple-950 text-purple-300 border border-purple-500/30 hover:text-white">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-purple-600 text-white font-bold hover:bg-purple-500 shadow-lg shadow-purple-600/30 flex items-center gap-2">
            <i data-lucide="save" class="w-4 h-4"></i> Save Event
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    let events = [];

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar('events');
      document.getElementById('topbar-layer').innerHTML = buildTopbar('Events', 'Create, manage, and track organizational events');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      lucide.createIcons();

      initSupabase();
      await checkConnection();

      const ok = await guardAuth();
      if (!ok) return;
      await loadUserProfile();

      await loadEvents();
      renderEvents();
    });

    /* ---------- CONNECTION CHECK ---------- */
    async function checkConnection() {
      const iconEl = document.getElementById('connIcon');
      const titleEl = document.getElementById('connTitle');
      const subEl = document.getElementById('connSub');

      if (!window.supabaseClient) {
        iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
        iconEl.innerHTML = '<i data-lucide="wifi-off" class="w-4 h-4 text-red-300"></i>';
        titleEl.textContent = 'Supabase NOT connected';
        subEl.textContent = 'Check config.js';
        lucide.createIcons();
        return false;
      }

      try {
        const { error } = await window.supabaseClient.from('events').select('id').limit(1);
        if (error) {
          iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
          iconEl.innerHTML = '<i data-lucide="alert-circle" class="w-4 h-4 text-red-300"></i>';
          titleEl.textContent = 'Table error: ' + error.message;
          subEl.textContent = 'Check RLS or table name';
        } else {
          iconEl.className = 'p-2 rounded-xl bg-emerald-500/20 border border-emerald-500/30';
          iconEl.innerHTML = '<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-300"></i>';
          titleEl.textContent = 'Supabase connected ✅';
          subEl.textContent = 'Data will persist across refreshes';
        }
        lucide.createIcons();
        return !error;
      } catch (err) {
        titleEl.textContent = 'Connection failed';
        subEl.textContent = err.message;
        return false;
      }
    }

    /* ---------- LOAD ---------- */
    async function loadEvents() {
      const container = document.getElementById('eventsList');
      container.innerHTML = `<p class="text-center text-purple-300/60 py-6 text-xs italic">Loading from Supabase...</p>`;

      if (!window.supabaseClient) {
        events = [];
        renderEvents();
        return;
      }

      try {
        const { data, error } = await window.supabaseClient
          .from('events').select('*').order('event_date', { ascending: false });

        if (error) {
          container.innerHTML = `<p class="text-center text-red-300 py-6 text-xs italic">Error: ${error.message}</p>`;
          renderStats();
          return;
        }

        events = data || [];
        renderEvents();

      } catch (err) {
        container.innerHTML = `<p class="text-center text-red-300 py-6 text-xs italic">Error: ${err.message}</p>`;
      }
    }

    /* ---------- STATS ---------- */
    function renderStats() {
      document.getElementById('eventStatTotal').textContent = events.length;
      document.getElementById('eventStatUpcoming').textContent = events.filter(e => e.status === 'upcoming').length;
      document.getElementById('eventStatCompleted').textContent = events.filter(e => e.status === 'completed').length;

      const now = new Date();
      document.getElementById('eventStatMonth').textContent = events.filter(e => {
        if (!e.event_date) return false;
        const d = new Date(e.event_date);
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      }).length;
    }

    /* ---------- RENDER ---------- */
    function renderEvents() {
      renderStats();

      const q = (document.getElementById('eventSearch').value || '').toLowerCase();
      const filter = document.getElementById('eventFilter').value;
      const list = events.filter(e => {
        if (filter !== 'all' && e.status !== filter) return false;
        if (q && !((e.title || '') + ' ' + (e.org || '') + ' ' + (e.venue || '')).toLowerCase().includes(q)) return false;
        return true;
      }).sort((a, b) => new Date(b.event_date) - new Date(a.event_date));

      const container = document.getElementById('eventsList');
      if (list.length === 0) {
        container.innerHTML = `<p class="text-center text-purple-300/60 py-8 text-xs italic">No events found. Click "Create Event" to add one.</p>`;
        return;
      }

      const statusColors = {
        upcoming: 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30',
        ongoing: 'bg-amber-500/20 text-amber-300 border-amber-400/30',
        completed: 'bg-purple-500/20 text-purple-300 border-purple-400/30',
        cancelled: 'bg-red-500/20 text-red-300 border-red-400/30'
      };
      const typeIcons = {
        meeting: 'users', seminar: 'presentation', sports: 'trophy',
        community: 'heart-handshake', other: 'star'
      };

      container.innerHTML = list.map(e => {
        const date = e.event_date ? new Date(e.event_date) : null;
        const dateStr = date ? date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
        const timeStr = date ? date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '—';

        return `
          <div class="p-4 rounded-2xl bg-purple-950/50 border border-purple-500/30 hover:border-purple-400/60 transition-all">
            <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
              <div class="flex items-start gap-3 flex-1 min-w-0">
                <div class="p-3 rounded-xl bg-purple-500/20 border border-purple-400/30 shrink-0">
                  <i data-lucide="${typeIcons[e.event_type] || 'calendar'}" class="w-5 h-5 text-purple-300"></i>
                </div>
                <div class="space-y-1 min-w-0 flex-1">
                  <div class="flex items-center gap-2 flex-wrap">
                    <h4 class="font-bold text-white text-sm">${e.title}</h4>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${statusColors[e.status] || ''}">${e.status || '—'}</span>
                  </div>
                  <p class="text-[11px] text-purple-300/70 line-clamp-1">${e.description || 'No description'}</p>
                  <div class="flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-purple-300/80 pt-1">
                    <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i>${dateStr}</span>
                    <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i>${timeStr}</span>
                    <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i>${e.venue || '—'}</span>
                    <span class="flex items-center gap-1"><i data-lucide="building-2" class="w-3 h-3"></i>${e.org || '—'}</span>
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <a href="attendance.html?event=${e.id}" class="px-3 py-1.5 rounded-lg bg-purple-600/30 hover:bg-purple-600 text-purple-200 hover:text-white text-[11px] font-bold border border-purple-500/40 transition-all flex items-center gap-1">
                  <i data-lucide="clipboard-check" class="w-3 h-3"></i><span>Attendance</span>
                </a>
                <button onclick="deleteEvent(${e.id})" class="p-1.5 rounded-lg text-purple-400 hover:text-red-300 hover:bg-red-500/20 transition-all">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    /* ---------- MODAL ---------- */
    function openEventModal() {
      document.getElementById('event-form').reset();
      document.getElementById('modal-event').classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeModal(id) {
      const m = document.getElementById(id);
      if (m) m.classList.add('opacity-0', 'pointer-events-none');
    }

    /* ---------- SAVE EVENT ---------- */
    async function saveEvent(event) {
      event.preventDefault();

      if (!window.supabaseClient) {
        showToast('Cannot Save', 'Supabase not connected.');
        return;
      }

      const dateValue = document.getElementById('event-date').value;
      if (!dateValue) {
        showToast('Missing Date', 'Please select the event date & time.');
        return;
      }

      const payload = {
        title: document.getElementById('event-title').value.trim(),
        description: document.getElementById('event-desc').value.trim(),
        org: document.getElementById('event-org').value.trim(),
        venue: document.getElementById('event-venue').value.trim(),
        event_date: new Date(dateValue).toISOString(),
        event_type: document.getElementById('event-type').value,
        status: document.getElementById('event-status').value,
      };

      try {
        const { error } = await window.supabaseClient.from('events').insert([payload]).select();

        if (error) {
          showToast('Save Failed ❌', error.message);
          return;
        }

        closeModal('modal-event');
        document.getElementById('event-form').reset();
        await loadEvents();
        showToast('Event Created ✅', `${payload.title} scheduled.`);

      } catch (err) {
        showToast('Save Failed', err.message);
      }
    }

    /* ---------- DELETE EVENT ---------- */
    async function deleteEvent(id) {
      if (!confirm('Delete this event and all its attendance records?')) return;

      if (!window.supabaseClient) {
        showToast('Cannot Delete', 'Supabase not connected.');
        return;
      }

      try {
        // Delete attendance records for this event first (cascade safety)
        try {
          await window.supabaseClient.from('attendance').delete().eq('event_id', id);
        } catch (e) { /* table may not exist, ignore */ }

        const { error } = await window.supabaseClient.from('events').delete().eq('id', id);

        if (error) {
          showToast('Delete Failed ❌', error.message);
          return;
        }

        await loadEvents();
        showToast('Event Deleted ✅', 'Event removed from database.');

      } catch (err) {
        showToast('Delete Failed', err.message);
      }
    }
  </script>
</body>
</html>
