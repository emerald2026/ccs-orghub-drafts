<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — CCS OrgHub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
        colors: { purple: {
          950:'#0f041c',900:'#1e0836',850:'#2d0a4e',800:'#3b0764',700:'#581c87',
          600:'#7e22ce',500:'#a855f7',400:'#c084fc',300:'#d8b4fe',200:'#e9d5ff',100:'#f3e8ff',50:'#faf5ff'
        }}
      }}
    }
  </script>

  <style>
    body { background: radial-gradient(circle at 10% 20%, #2d0a4e 0%, #1a052e 45%, #0a0212 100%); background-attachment: fixed; color: #f3e8ff; }
    .glass-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(24px); border: 1px solid rgba(168,85,247,0.3); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .glass-header { background: rgba(15,4,28,0.7); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(168,85,247,0.2); }
    .orb { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; }
    input::placeholder { color: rgba(216,180,254,0.5); }
  </style>
</head>

<body class="h-full font-sans antialiased selection:bg-purple-500 selection:text-white overflow-hidden">

  <video autoplay loop muted playsinline class="fixed inset-0 w-full h-full object-cover z-0 opacity-25">
    <source src="src/loop-bg.mp4" type="video/mp4">
  </video>

  <div class="orb w-96 h-96 bg-purple-700/40 top-0 left-10 animate-pulse"></div>
  <div class="orb w-[30rem] h-[30rem] bg-purple-900/50 bottom-0 right-10"></div>
  <div class="orb w-80 h-80 bg-fuchsia-600/25 top-1/2 left-1/3"></div>

  <div class="fixed inset-0 bg-black/40 z-[1]"></div>

  <header class="glass-header fixed top-0 left-0 right-0 z-30 px-4 md:px-10 py-3.5 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3 md:gap-4">
      <img src="src/logo.png" alt="ESSU Logo" class="h-10 md:h-12 w-auto">
      <img src="src/ccs.png" alt="CCS Logo" class="h-10 md:h-12 w-auto">
      <div class="hidden sm:flex flex-col leading-tight">
        <span class="text-xs md:text-sm font-extrabold tracking-widest text-white">CCS ORGHUB</span>
        <span class="text-[10px] text-purple-300/70 uppercase tracking-wider">Registration</span>
      </div>
    </a>
    <a href="index.html" class="px-4 py-2 rounded-xl bg-purple-950/60 border border-purple-500/40 text-purple-200 hover:text-white text-xs font-bold flex items-center gap-2">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Login
    </a>
  </header>

  <main class="relative z-10 flex items-center justify-center min-h-screen p-4 pt-24 pb-8">

    <div class="glass-card w-full max-w-md rounded-3xl p-7 md:p-8 space-y-6">

      <div class="text-center space-y-2">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-purple-500 to-purple-800 border border-purple-400/40 flex items-center justify-center shadow-lg shadow-purple-600/40">
          <i data-lucide="user-plus" class="w-7 h-7 text-white"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-white tracking-tight">Create an Account</h1>
        <p class="text-xs text-purple-300/70">Join the CCS OrgHub community</p>
      </div>

      <form id="registerForm" class="space-y-4 text-xs">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-purple-200 mb-1.5 text-[11px] uppercase tracking-wider">First Name</label>
            <input type="text" id="firstName" required placeholder="Juan"
              class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none" />
          </div>
          <div>
            <label class="block font-semibold text-purple-200 mb-1.5 text-[11px] uppercase tracking-wider">Last Name</label>
            <input type="text" id="lastName" required placeholder="Dela Cruz"
              class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none" />
          </div>
        </div>

        <div>
          <label class="block font-semibold text-purple-200 mb-1.5 text-[11px] uppercase tracking-wider">Email Address</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-purple-400/70"></i>
            <input type="email" id="regEmail" required placeholder="you@essu.edu.ph"
              class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl pl-10 pr-3.5 py-2.5 text-sm text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none" />
          </div>
        </div>

        <div>
          <label class="block font-semibold text-purple-200 mb-1.5 text-[11px] uppercase tracking-wider">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-purple-400/70"></i>
            <input type="password" id="regPassword" required placeholder="••••••••"
              class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl pl-10 pr-16 py-2.5 text-sm text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none" />
            <button type="button" id="toggleRegPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-[11px] font-bold text-purple-300 hover:text-white px-2 py-1 rounded-lg hover:bg-purple-500/20">Show</button>
          </div>
        </div>

        <div>
          <label class="block font-semibold text-purple-200 mb-1.5 text-[11px] uppercase tracking-wider">Confirm Password</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-purple-400/70"></i>
            <input type="password" id="confirmPassword" required placeholder="••••••••"
              class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl pl-10 pr-16 py-2.5 text-sm text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none" />
            <button type="button" id="toggleConfirmPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-[11px] font-bold text-purple-300 hover:text-white px-2 py-1 rounded-lg hover:bg-purple-500/20">Show</button>
          </div>
        </div>

        <button type="submit" id="submitBtn"
          class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-500 to-purple-700 text-white font-extrabold text-sm shadow-lg shadow-purple-600/40 hover:brightness-110 transition-all flex items-center justify-center gap-2 border border-purple-400/40 mt-2">
          <i data-lucide="user-plus" class="w-4 h-4"></i>
          <span>Sign Up</span>
        </button>

        <p class="text-center text-xs text-purple-300/80 pt-2">
          Already have an account?
          <a href="index.html" class="text-purple-300 hover:text-white font-bold">Log In</a>
        </p>

      </form>
    </div>
  </main>

  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // ✅ INIT SUPABASE FIRST
      initSupabase();
      lucide.createIcons();

      if (!window.supabaseClient) {
        showToast('Connection Error', 'Supabase client not loaded. Check config.js.');
        console.error('Supabase client is undefined. Check config.js has window.SUPABASE_URL + window.SUPABASE_ANON_KEY.');
        return;
      }
    });

    /* Password toggles */
    function setupToggle(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      btn.addEventListener('click', () => {
        input.type = input.type === 'password' ? 'text' : 'password';
        btn.textContent = input.type === 'password' ? 'Show' : 'Hide';
      });
    }
    setupToggle('regPassword', 'toggleRegPassword');
    setupToggle('confirmPassword', 'toggleConfirmPassword');

    /* Register submit */
    document.getElementById('registerForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      if (!window.supabaseClient) {
        showToast('Connection Error', 'Supabase not initialized.');
        return;
      }

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;

      if (pass.length < 6) {
        showToast('Weak Password', 'At least 6 characters.');
        return;
      }
      if (pass !== confirmPass) {
        showToast('Password Mismatch', 'Passwords do not match.');
        return;
      }

      const btn = document.getElementById('submitBtn');
      const originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path></svg><span>Creating...</span>';

      try {
        const { data, error } = await window.supabaseClient.auth.signUp({
          email: email,
          password: pass,
          options: {
            data: {
              first_name: firstName,
              last_name: lastName,
              role: 'student',
            }
          }
        });

        if (error) {
          showToast('Registration Failed', error.message);
          return;
        }

        if (data.user && data.session) {
          showToast('Welcome!', 'Account created. Redirecting...');
          setTimeout(() => window.location.replace('student-dashboard.html'), 1400);
        } else if (data.user) {
          showToast('Check Your Email', 'We sent a confirmation link to ' + email);
        }

        document.getElementById('registerForm').reset();

      } catch (err) {
        showToast('Error', err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalHTML;
        lucide.createIcons();
      }
    });
  </script>

</body>
</html>
