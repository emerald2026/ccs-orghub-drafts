<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clearance Approvals — CCS OrgHub Admin</title>

  <link rel="icon" type="image/png" href="ccs.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found. Demo mode.')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
        colors: { purple: {
          950:'#0f041c',900:'#1e0836',850:'#2d0a4e',800:'#3b0764',700:'#581c87',
          600:'#7e22ce',500:'#a855f7',400:'#c084fc',300:'#d8b4fe',200:'#e9d5ff',100:'#f3e8ff',50:'#faf5ff'
        }}
      }}
    }
  </script>
</head>

<body class="h-full font-sans antialiased selection:bg-purple-500 selection:text-white flex overflow-hidden">

  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">
    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">

      <!-- CONNECTION STATUS -->
      <div id="connectionStatus" class="glass-card p-4 rounded-2xl flex items-center gap-3 text-xs">
        <div id="connIcon" class="p-2 rounded-xl bg-amber-500/20 border border-amber-500/30">
          <i data-lucide="wifi" class="w-4 h-4 text-amber-300"></i>
        </div>
        <div>
          <div id="connTitle" class="font-bold text-white">Connecting to clearance records...</div>
          <div id="connSub" class="text-purple-300/70">Verifying database access</div>
        </div>
      </div>

      <!-- STATS -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Total Requests</span>
            <div class="p-2.5 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/30"><i data-lucide="file-text" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-white" id="statTotal">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Pending</span>
            <div class="p-2.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/30"><i data-lucide="clock" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-amber-300" id="statPending">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Approved</span>
            <div class="p-2.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-emerald-300" id="statApproved">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Rejected</span>
            <div class="p-2.5 rounded-xl bg-red-500/20 text-red-300 border border-red-500/30"><i data-lucide="x-circle" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-red-300" id="statRejected">—</div>
        </div>
      </div>

      <!-- CLEARANCE LIST -->
      <div class="glass-card p-6 rounded-3xl space-y-4">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="shield-check" class="w-5 h-5 text-purple-400"></i> Clearance Requests
          </h3>
          <button onclick="loadClearances()" class="px-3 py-1.5 rounded-lg bg-purple-950/60 hover:bg-purple-800/60 text-purple-200 border border-purple-500/30 text-[11px] font-bold transition-all flex items-center gap-1.5">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
          </button>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-purple-300/60"></i>
            <input id="clearanceSearch" oninput="renderClearances()" placeholder="Search by student or organization..."
              class="w-full bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white placeholder-purple-300/50 focus:border-purple-400 focus:outline-none" />
          </div>
          <select id="clearanceFilter" onchange="renderClearances()"
            class="bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 px-3 text-xs text-white focus:border-purple-400 focus:outline-none">
            <option value="all">All Status</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>

        <div class="overflow-x-auto rounded-2xl border border-purple-500/20">
          <table class="w-full text-left text-xs">
            <thead class="bg-purple-950/80 text-purple-300 uppercase tracking-wider font-semibold border-b border-purple-500/20">
              <tr>
                <th class="py-3.5 px-4">Student</th>
                <th class="py-3.5 px-4">Organization</th>
                <th class="py-3.5 px-4">Purpose</th>
                <th class="py-3.5 px-4">Status</th>
                <th class="py-3.5 px-4">Submitted</th>
                <th class="py-3.5 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="clearancesTable" class="divide-y divide-purple-500/10 text-purple-100">
              <tr><td colspan="6" class="py-8 text-center text-purple-300/60 italic">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ============ APPROVE/REJECT MODAL ============ -->
  <div id="modal-review" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="glass-card w-full max-w-lg rounded-3xl p-6 shadow-2xl border border-purple-400/40 space-y-5 relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal('modal-review')" class="absolute top-5 right-5 text-purple-300 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="flex items-center space-x-3">
        <div class="p-2.5 rounded-xl bg-purple-600/30 text-purple-300 border border-purple-400/40">
          <i data-lucide="clipboard-check" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="text-lg font-bold text-white">Review Clearance</h3>
          <p class="text-xs text-purple-300/70" id="reviewSubtitle">—</p>
        </div>
      </div>

      <!-- Details -->
      <div id="reviewDetails" class="space-y-3 text-xs"></div>

      <!-- Action buttons -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="approveCurrent()" id="approveBtn"
          class="px-5 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white font-bold text-xs shadow-lg shadow-emerald-500/40 transition-all flex items-center justify-center gap-2">
          <i data-lucide="check" class="w-4 h-4"></i>
          <span>Approve</span>
        </button>
        <button onclick="rejectCurrent()" id="rejectBtn"
          class="px-5 py-3 rounded-xl bg-red-500 hover:bg-red-400 text-white font-bold text-xs shadow-lg shadow-red-500/40 transition-all flex items-center justify-center gap-2">
          <i data-lucide="x" class="w-4 h-4"></i>
          <span>Reject</span>
        </button>
      </div>

      <!-- Remarks input for rejection -->
      <div id="rejectBox" class="hidden space-y-2 pt-2">
        <label class="block font-semibold text-red-200 text-[11px] uppercase tracking-wider">Reason for Rejection *</label>
        <textarea id="rejectRemarks" rows="2" placeholder="Explain why this request was rejected..."
          class="w-full bg-purple-950/60 border border-red-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-purple-300/40 focus:border-red-400 focus:outline-none resize-none"></textarea>
        <div class="flex justify-end gap-2">
          <button onclick="hideRejectBox()" class="px-4 py-2 rounded-xl bg-purple-950/60 text-purple-200 border border-purple-500/30 text-xs font-bold">Cancel</button>
          <button onclick="confirmReject()" class="px-4 py-2 rounded-xl bg-red-500 hover:bg-red-400 text-white text-xs font-bold">Confirm Reject</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    let clearances = [];
    let currentReview = null;

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar('clearance');
      document.getElementById('topbar-layer').innerHTML = buildTopbar('Clearance Approvals', 'Review and approve student clearance requests');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      lucide.createIcons();
      initSupabase();
      await checkConnection();

      const ok = await guardAuth();
      if (!ok) return;
      await loadUserProfile();

      await loadClearances();
    });

    async function checkConnection() {
      const iconEl = document.getElementById('connIcon');
      const titleEl = document.getElementById('connTitle');
      const subEl = document.getElementById('connSub');

      if (!window.supabaseClient) {
        iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
        iconEl.innerHTML = '<i data-lucide="wifi-off" class="w-4 h-4 text-red-300"></i>';
        titleEl.textContent = 'Supabase NOT connected';
        subEl.textContent = 'Check config.js';
        lucide.createIcons();
        return false;
      }

      try {
        const { error } = await window.supabaseClient.from('clearances').select('id').limit(1);
        if (error) {
          iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
          iconEl.innerHTML = '<i data-lucide="alert-circle" class="w-4 h-4 text-red-300"></i>';
          titleEl.textContent = 'Table error: ' + error.message;
          subEl.textContent = 'Run SQL to create clearances table';
        } else {
          iconEl.className = 'p-2 rounded-xl bg-emerald-500/20 border border-emerald-500/30';
          iconEl.innerHTML = '<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-300"></i>';
          titleEl.textContent = 'Supabase connected ✅';
          subEl.textContent = 'Data will persist across refreshes';
        }
        lucide.createIcons();
        return !error;
      } catch (err) {
        titleEl.textContent = 'Connection failed';
        subEl.textContent = err.message;
        return false;
      }
    }

    async function loadClearances() {
      const tbody = document.getElementById('clearancesTable');
      tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-purple-300/60 italic">Loading...</td></tr>`;

      if (!window.supabaseClient) {
        clearances = [];
        renderClearances();
        renderStats();
        return;
      }

      try {
        const { data, error } = await window.supabaseClient
          .from('clearances').select('*').order('created_at', { ascending: false });

        if (error) {
          tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-300 italic">Error: ${error.message}</td></tr>`;
          return;
        }

        clearances = data || [];
        renderClearances();
        renderStats();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-300 italic">Error: ${err.message}</td></tr>`;
      }
    }

    function renderStats() {
      document.getElementById('statTotal').textContent = clearances.length;
      document.getElementById('statPending').textContent = clearances.filter(c => c.status === 'pending').length;
      document.getElementById('statApproved').textContent = clearances.filter(c => c.status === 'approved').length;
      document.getElementById('statRejected').textContent = clearances.filter(c => c.status === 'rejected').length;
    }

    function renderClearances() {
      const q = (document.getElementById('clearanceSearch').value || '').toLowerCase();
      const filter = document.getElementById('clearanceFilter').value;

      const list = clearances.filter(c => {
        if (filter !== 'all' && c.status !== filter) return false;
        if (q && !((c.student_name || '') + ' ' + (c.org || '')).toLowerCase().includes(q)) return false;
        return true;
      });

      const tbody = document.getElementById('clearancesTable');
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-purple-300/60 italic">No clearance requests found.</td></tr>`;
        return;
      }

      const statusColor = {
        pending: 'bg-amber-500/20 text-amber-300 border-amber-400/30',
        approved: 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30',
        rejected: 'bg-red-500/20 text-red-300 border-red-400/30',
      };

      tbody.innerHTML = list.map(c => `
        <tr class="hover:bg-purple-900/30 transition-colors">
          <td class="py-3.5 px-4">
            <div class="font-semibold text-white">${c.student_name || '—'}</div>
            <div class="text-[10px] text-purple-300/60 font-mono">${c.student_code || ''}</div>
          </td>
          <td class="py-3.5 px-4 text-purple-200">${c.org || '—'}</td>
          <td class="py-3.5 px-4 text-purple-200">${c.purpose || '—'}</td>
          <td class="py-3.5 px-4">
            <span class="px-2 py-1 rounded-full text-[10px] font-bold border ${statusColor[c.status] || ''}">${c.status}</span>
          </td>
          <td class="py-3.5 px-4 text-purple-300/80">${c.created_at ? new Date(c.created_at).toLocaleDateString() : '—'}</td>
          <td class="py-3.5 px-4 text-right space-x-1">
            ${c.status === 'pending' ? `
              <button onclick="openReview(${c.id})" class="px-2.5 py-1 rounded-lg bg-purple-500/20 hover:bg-purple-500 text-purple-300 hover:text-white text-[10px] font-bold border border-purple-500/30 transition-all">
                Review
              </button>` : `
              <button onclick="openReview(${c.id})" class="px-2.5 py-1 rounded-lg bg-purple-500/20 hover:bg-purple-500 text-purple-300 hover:text-white text-[10px] font-bold border border-purple-500/30 transition-all">
                View
              </button>`}
          </td>
        </tr>
      `).join('');
      lucide.createIcons();
    }

    /* ---------- OPEN REVIEW MODAL ---------- */
    function openReview(id) {
      const c = clearances.find(x => x.id === id);
      if (!c) return;
      currentReview = c;

      document.getElementById('reviewSubtitle').textContent = `${c.student_name || 'Student'} — ${c.org || 'N/A'}`;

      const statusColor = {
        pending: 'bg-amber-500/20 text-amber-300 border-amber-400/30',
        approved: 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30',
        rejected: 'bg-red-500/20 text-red-300 border-red-400/30',
      };

      const reqs = Array.isArray(c.requirements) ? c.requirements : [];
      const reqsHtml = reqs.length > 0
        ? reqs.map(r => `
            <div class="flex items-center gap-2 text-emerald-300">
              <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
              <span class="text-white">${r}</span>
            </div>`).join('')
        : '<div class="text-purple-300/60 italic">No requirements listed</div>';

      document.getElementById('reviewDetails').innerHTML = `
        <div class="flex items-center gap-2">
          <span class="px-2 py-1 rounded-full text-[10px] font-bold border ${statusColor[c.status] || ''}">${c.status.toUpperCase()}</span>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="p-3 rounded-xl bg-purple-950/60 border border-purple-500/30">
            <div class="text-[10px] uppercase tracking-wider text-purple-300/70 font-bold mb-1">Student</div>
            <div class="text-white font-semibold text-xs">${c.student_name || '—'}</div>
            <div class="text-[10px] text-purple-300/60 font-mono">${c.student_code || ''}</div>
          </div>
          <div class="p-3 rounded-xl bg-purple-950/60 border border-purple-500/30">
            <div class="text-[10px] uppercase tracking-wider text-purple-300/70 font-bold mb-1">Organization</div>
            <div class="text-white font-semibold text-xs">${c.org || '—'}</div>
          </div>
          <div class="p-3 rounded-xl bg-purple-950/60 border border-purple-500/30">
            <div class="text-[10px] uppercase tracking-wider text-purple-300/70 font-bold mb-1">Purpose</div>
            <div class="text-white font-semibold text-xs">${c.purpose || '—'}</div>
          </div>
          <div class="p-3 rounded-xl bg-purple-950/60 border border-purple-500/30">
            <div class="text-[10px] uppercase tracking-wider text-purple-300/70 font-bold mb-1">Submitted</div>
            <div class="text-white font-semibold text-xs">${c.created_at ? new Date(c.created_at).toLocaleDateString() : '—'}</div>
          </div>
        </div>
        <div class="p-3 rounded-xl bg-purple-950/40 border border-purple-500/30">
          <div class="text-[10px] uppercase tracking-wider text-purple-300/70 font-bold mb-2">Requirements Met</div>
          <div class="space-y-1.5">${reqsHtml}</div>
        </div>
        ${c.remarks ? `<div class="p-3 rounded-xl bg-purple-900/40 border border-purple-500/30"><div class="text-[10px] uppercase tracking-wider text-purple-300/70 font-bold mb-1">Remarks</div><div class="text-purple-100 text-xs">${c.remarks}</div></div>` : ''}
      `;

      // Show/hide action buttons based on status
      const isPending = c.status === 'pending';
      document.getElementById('approveBtn').classList.toggle('hidden', !isPending);
      document.getElementById('rejectBtn').classList.toggle('hidden', !isPending);
      document.getElementById('rejectBox').classList.add('hidden');

      document.getElementById('modal-review').classList.remove('opacity-0', 'pointer-events-none');
      lucide.createIcons();
    }

    function closeModal(id) {
      const m = document.getElementById(id);
      if (m) m.classList.add('opacity-0', 'pointer-events-none');
    }

    /* ---------- APPROVE ---------- */
    async function approveCurrent() {
      if (!currentReview || !window.supabaseClient) return;

      const { error } = await window.supabaseClient
        .from('clearances')
        .update({
          status: 'approved',
          approved_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
        })
        .eq('id', currentReview.id);

      if (error) {
        showToast('Approve Failed ❌', error.message);
        return;
      }

      closeModal('modal-review');
      await loadClearances();
      showToast('Clearance Approved ✅', `${currentReview.student_name} — ${currentReview.org}`);
    }

    /* ---------- REJECT ---------- */
    function rejectCurrent() {
      document.getElementById('rejectBox').classList.remove('hidden');
      document.getElementById('rejectRemarks').focus();
    }

    function hideRejectBox() {
      document.getElementById('rejectBox').classList.add('hidden');
      document.getElementById('rejectRemarks').value = '';
    }

    async function confirmReject() {
      const remarks = document.getElementById('rejectRemarks').value.trim();
      if (!remarks) {
        showToast('Missing Reason', 'Please provide a reason for rejection.');
        return;
      }

      if (!currentReview || !window.supabaseClient) return;

      const { error } = await window.supabaseClient
        .from('clearances')
        .update({
          status: 'rejected',
          remarks: remarks,
          updated_at: new Date().toISOString(),
        })
        .eq('id', currentReview.id);

      if (error) {
        showToast('Reject Failed ❌', error.message);
        return;
      }

      hideRejectBox();
      closeModal('modal-review');
      await loadClearances();
      showToast('Clearance Rejected', `${currentReview.student_name} — ${currentReview.org}`);
    }
  </script>

</body>
</html>
