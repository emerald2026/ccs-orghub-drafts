<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Membership — CCS OrgHub Admin</title>

  <link rel="icon" type="image/png" href="ccs.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found. Demo mode.')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
        colors: { purple: {
          950:'#0f041c',900:'#1e0836',850:'#2d0a4e',800:'#3b0764',700:'#581c87',
          600:'#7e22ce',500:'#a855f7',400:'#c084fc',300:'#d8b4fe',200:'#e9d5ff',100:'#f3e8ff',50:'#faf5ff'
        }}
      }}
    }
  </script>
</head>

<body class="h-full font-sans antialiased selection:bg-purple-500 selection:text-white">

  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">
    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">

      <!-- CONNECTION STATUS -->
      <div id="connectionStatus" class="glass-card p-4 rounded-2xl flex items-center gap-3 text-xs">
        <div id="connIcon" class="p-2 rounded-xl bg-amber-500/20 border border-amber-500/30">
          <i data-lucide="wifi" class="w-4 h-4 text-amber-300"></i>
        </div>
        <div>
          <div id="connTitle" class="font-bold text-white">Checking Supabase connection...</div>
          <div id="connSub" class="text-purple-300/70">Verifying database access</div>
        </div>
      </div>

      <!-- STATS -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Total Members</span>
            <div class="p-2.5 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/30"><i data-lucide="users" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-white" id="statTotal">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Active</span>
            <div class="p-2.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"><i data-lucide="user-check" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-emerald-300" id="statActive">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Pending</span>
            <div class="p-2.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/30"><i data-lucide="clock" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-amber-300" id="statPending">—</div>
        </div>
      </div>

      <!-- TABLE -->
      <div class="glass-card p-6 rounded-3xl space-y-4">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="user-check" class="w-5 h-5 text-purple-400"></i> Organization Memberships
          </h3>
          <button onclick="loadMemberships()" class="px-3 py-1.5 rounded-lg bg-purple-950/60 hover:bg-purple-800/60 text-purple-200 border border-purple-500/30 text-[11px] font-bold transition-all flex items-center gap-1.5">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
          </button>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-purple-300/60"></i>
            <input id="searchMemberships" oninput="renderMemberships()" placeholder="Search student or organization..."
              class="w-full bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white placeholder-purple-300/50 focus:border-purple-400 focus:outline-none" />
          </div>
          <select id="filterStatus" onchange="renderMemberships()"
            class="bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 px-3 text-xs text-white focus:border-purple-400 focus:outline-none">
            <option value="all">All Status</option>
            <option value="active">Active</option>
            <option value="pending">Pending</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>

        <div class="overflow-x-auto rounded-2xl border border-purple-500/20">
          <table class="w-full text-left text-xs">
            <thead class="bg-purple-950/80 text-purple-300 uppercase tracking-wider font-semibold border-b border-purple-500/20">
              <tr>
                <th class="py-3.5 px-4">Student</th>
                <th class="py-3.5 px-4">Organization</th>
                <th class="py-3.5 px-4">Role</th>
                <th class="py-3.5 px-4">Status</th>
                <th class="py-3.5 px-4">Date Joined</th>
                <th class="py-3.5 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="membershipsTable" class="divide-y divide-purple-500/10 text-purple-100">
              <tr><td colspan="6" class="py-8 text-center text-purple-300/60 italic">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    let memberships = [];

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar('membership');
      document.getElementById('topbar-layer').innerHTML = buildTopbar('Membership Management', 'Manage student organization memberships');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      lucide.createIcons();
      initSupabase();
      await checkConnection();

      const ok = await guardAuth();
      if (!ok) return;
      await loadUserProfile();

      await loadMemberships();
    });

    async function checkConnection() {
      const iconEl = document.getElementById('connIcon');
      const titleEl = document.getElementById('connTitle');
      const subEl = document.getElementById('connSub');

      if (!window.supabaseClient) {
        iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
        iconEl.innerHTML = '<i data-lucide="wifi-off" class="w-4 h-4 text-red-300"></i>';
        titleEl.textContent = 'Supabase NOT connected';
        subEl.textContent = 'Check config.js';
        lucide.createIcons();
        return false;
      }

      try {
        const { error } = await window.supabaseClient.from('memberships').select('id').limit(1);
        if (error) {
          iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
          iconEl.innerHTML = '<i data-lucide="alert-circle" class="w-4 h-4 text-red-300"></i>';
          titleEl.textContent = 'Table error: ' + error.message;
          subEl.textContent = 'Check RLS or table name';
        } else {
          iconEl.className = 'p-2 rounded-xl bg-emerald-500/20 border border-emerald-500/30';
          iconEl.innerHTML = '<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-300"></i>';
          titleEl.textContent = 'Supabase connected ✅';
          subEl.textContent = 'Data will persist across refreshes';
        }
        lucide.createIcons();
        return !error;
      } catch (err) {
        titleEl.textContent = 'Connection failed';
        subEl.textContent = err.message;
        return false;
      }
    }

    async function loadMemberships() {
      const tbody = document.getElementById('membershipsTable');
      tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-purple-300/60 italic">Loading from Supabase...</td></tr>`;

      if (!window.supabaseClient) {
        memberships = [];
        renderMemberships();
        renderStats();
        return;
      }

      try {
        // Assuming you have a memberships table joining students and organizations
        const { data, error } = await window.supabaseClient
          .from('memberships')
          .select(`
            id, 
            role,
            status, 
            created_at,
            student_name,
            org
          `)
          .order('created_at', { ascending: false });

        if (error) {
          tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-300 italic">Error: ${error.message}</td></tr>`;
          return;
        }

        memberships = data || [];
        renderMemberships();
        renderStats();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-300 italic">Error: ${err.message}</td></tr>`;
      }
    }

    function renderStats() {
      document.getElementById('statTotal').textContent = memberships.length;
      document.getElementById('statActive').textContent = memberships.filter(m => m.status === 'active').length;
      document.getElementById('statPending').textContent = memberships.filter(m => m.status === 'pending').length;
    }

    function renderMemberships() {
      const q = (document.getElementById('searchMemberships').value || '').toLowerCase();
      const filter = document.getElementById('filterStatus').value;

      const list = memberships.filter(m => {
        if (filter !== 'all' && m.status !== filter) return false;
        if (q && !((m.student_name || '') + ' ' + (m.org || '')).toLowerCase().includes(q)) return false;
        return true;
      });

      const tbody = document.getElementById('membershipsTable');
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-purple-300/60 italic">No membership records found.</td></tr>`;
        return;
      }

      const statusColor = {
        active: 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30',
        pending: 'bg-amber-500/20 text-amber-300 border-amber-400/30',
        inactive: 'bg-red-500/20 text-red-300 border-red-400/30',
      };

      tbody.innerHTML = list.map(m => `
        <tr class="hover:bg-purple-900/30 transition-colors">
          <td class="py-3.5 px-4 font-semibold text-white">${m.student_name || '—'}</td>
          <td class="py-3.5 px-4 text-purple-200">${m.org || '—'}</td>
          <td class="py-3.5 px-4 text-purple-200">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-purple-900/80 border border-purple-500/30 capitalize">${m.role || 'Member'}</span>
          </td>
          <td class="py-3.5 px-4">
            <span class="px-2 py-1 rounded-full text-[10px] font-bold border ${statusColor[m.status] || ''} capitalize">${m.status}</span>
          </td>
          <td class="py-3.5 px-4 text-purple-300/80">${m.created_at ? new Date(m.created_at).toLocaleDateString() : '—'}</td>
          <td class="py-3.5 px-4 text-right space-x-1">
            ${m.status === 'pending' ? `
              <button onclick="updateStatus(${m.id}, 'active')" class="px-2.5 py-1 rounded-lg bg-emerald-500/20 hover:bg-emerald-500 text-emerald-300 hover:text-white text-[10px] font-bold border border-emerald-500/30 transition-all">Approve</button>
              <button onclick="updateStatus(${m.id}, 'inactive')" class="px-2.5 py-1 rounded-lg bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white text-[10px] font-bold border border-red-500/30 transition-all">Reject</button>
            ` : `
              <button onclick="deleteMembership(${m.id})" class="p-1.5 rounded-lg text-purple-400 hover:text-red-300 hover:bg-red-500/20 transition-all" title="Remove Member">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            `}
          </td>
        </tr>
      `).join('');
      lucide.createIcons();
    }

    async function updateStatus(id, newStatus) {
      if (!window.supabaseClient) return;
      try {
        const { error } = await window.supabaseClient
          .from('memberships')
          .update({ status: newStatus })
          .eq('id', id);

        if (error) {
          showToast('Update Failed ❌', error.message);
          return;
        }

        await loadMemberships();
        showToast(newStatus === 'active' ? 'Member Approved ✅' : 'Application Rejected', 'Status updated successfully.');
      } catch (err) {
        showToast('Update Failed', err.message);
      }
    }

    async function deleteMembership(id) {
      if (!confirm('Remove this member from the organization?')) return;
      if (!window.supabaseClient) return;

      try {
        const { error } = await window.supabaseClient
          .from('memberships')
          .delete()
          .eq('id', id);

        if (error) {
          showToast('Delete Failed ❌', error.message);
          return;
        }

        await loadMemberships();
        showToast('Member Removed ✅', 'Record deleted from database.');
      } catch (err) {
        showToast('Delete Failed', err.message);
      }
    }
  </script>

</body>
</html>
