<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITSO Announcements — CCS OrgHub</title>
  <link rel="icon" type="image/png" href="ccs.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
        colors: { purple: { 950:'#0f041c',900:'#1e0836',850:'#2d0a4e',800:'#3b0764',700:'#581c87',600:'#7e22ce',500:'#a855f7',400:'#c084fc',300:'#d8b4fe',200:'#e9d5ff',100:'#f3e8ff',50:'#faf5ff' }}
      }}
    }
  </script>
</head>
<body class="h-full font-sans antialiased selection:bg-purple-500 selection:text-white flex overflow-hidden">

  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">
    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">
      <div class="glass-card p-6 rounded-3xl space-y-4">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <div>
            <h3 class="text-base font-bold text-white flex items-center gap-2">
              <i data-lucide="megaphone" class="w-5 h-5 text-purple-400"></i> ITSO Announcements
            </h3>
            <p class="text-xs text-purple-300/70">Broadcast news and updates to organization members</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="openAnnouncementModal()" class="px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs shadow-lg shadow-purple-600/30 transition-all flex items-center gap-1.5">
              <i data-lucide="plus" class="w-4 h-4"></i> New Announcement
            </button>
          </div>
        </div>
        
        <div id="announcementsList" class="space-y-3">
          <p class="text-center text-purple-300/60 py-6 text-xs italic">Loading announcements...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL: ADD ANNOUNCEMENT -->
  <div id="modal-announcement" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="glass-card w-full max-w-lg rounded-3xl p-6 shadow-2xl border border-purple-400/40 space-y-5 relative">
      <button onclick="closeModal('modal-announcement')" class="absolute top-5 right-5 text-purple-300 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      <div class="flex items-center space-x-3">
        <div class="p-2.5 rounded-xl bg-purple-600/30 text-purple-300 border border-purple-400/40"><i data-lucide="megaphone" class="w-5 h-5"></i></div>
        <div>
          <h3 class="text-lg font-bold text-white">Post Announcement</h3>
          <p class="text-xs text-purple-300/70">Create a new update for ITSO students</p>
        </div>
      </div>
      <form id="announcementForm" onsubmit="submitAnnouncement(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-purple-200 mb-1.5 text-[11px] uppercase tracking-wider">Title *</label>
          <input id="ann-title" required placeholder="e.g. General Assembly"
            class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none" />
        </div>
        <div>
          <label class="block font-semibold text-purple-200 mb-1.5 text-[11px] uppercase tracking-wider">Content *</label>
          <textarea id="ann-content" required rows="4" placeholder="Write your announcement here..."
            class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none resize-none"></textarea>
        </div>
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeModal('modal-announcement')" class="px-4 py-2 rounded-xl bg-purple-950/60 hover:bg-purple-800/60 text-purple-200 border border-purple-500/30 text-xs font-bold transition-all">Cancel</button>
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-purple-500 to-purple-700 text-white font-bold text-xs shadow-lg shadow-purple-600/40 hover:brightness-110 flex items-center gap-2 border border-purple-400/40">
            <i data-lucide="send" class="w-4 h-4"></i> Post
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    const ORG_CODE = 'ITSO';
    const ORG_LABEL = 'ITSO';
    const ACTIVE_PAGE = 'org-announcements';

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar(ACTIVE_PAGE);
      document.getElementById('topbar-layer').innerHTML = buildTopbar('ITSO Announcements', 'Broadcast updates');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      lucide.createIcons();
      initSupabase();
      
      const auth = await guardOrgAuth(ORG_CODE);
      if (!auth.ok) return;
      
      await loadAnnouncements();
    });

    async function loadAnnouncements() {
      if (!window.supabaseClient) return;
      const list = document.getElementById('announcementsList');
      
      try {
        const { data } = await window.supabaseClient
          .from('announcements')
          .select('*')
          .eq('org', ORG_LABEL)
          .order('created_at', { ascending: false });

        if (!data || data.length === 0) {
          list.innerHTML = `<p class="text-center text-purple-300/60 py-6 text-xs italic">No announcements yet.</p>`;
          return;
        }

        list.innerHTML = data.map(a => `
          <div class="p-5 rounded-2xl bg-purple-950/50 border border-purple-500/30">
            <div class="flex items-start justify-between gap-3">
              <div>
                <h4 class="font-bold text-white text-sm">${a.title}</h4>
                <p class="text-[10px] text-purple-300/60 mt-0.5">Posted ${new Date(a.created_at).toLocaleDateString()}</p>
              </div>
              <button onclick="deleteAnnouncement(${a.id})" class="text-red-400 hover:text-red-300 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
            <p class="text-xs text-purple-200/80 mt-3 whitespace-pre-wrap">${a.content}</p>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = `<p class="text-center text-red-300 py-6 text-xs italic">Error loading announcements.</p>`;
      }
      lucide.createIcons();
    }

    window.openAnnouncementModal = () => {
      document.getElementById('announcementForm').reset();
      document.getElementById('modal-announcement').classList.remove('opacity-0', 'pointer-events-none');
    };

    window.closeModal = (id) => {
      const m = document.getElementById(id);
      if (m) m.classList.add('opacity-0', 'pointer-events-none');
    };

    async function submitAnnouncement(e) {
      e.preventDefault();
      if (!window.supabaseClient) return;
      
      const title = document.getElementById('ann-title').value.trim();
      const content = document.getElementById('ann-content').value.trim();

      try {
        const { error } = await window.supabaseClient.from('announcements').insert([{
          title, content, org: ORG_LABEL, author: 'ITSO Admin'
        }]);

        if (error) { showToast('Error', error.message); return; }
        
        closeModal('modal-announcement');
        showToast('Success', 'Announcement posted.');
        await loadAnnouncements();
      } catch (err) { console.error(err); }
    }

    window.deleteAnnouncement = async (id) => {
      if (!confirm('Delete this announcement?')) return;
      if (!window.supabaseClient) return;
      try {
        await window.supabaseClient.from('announcements').delete().eq('id', id);
        await loadAnnouncements();
      } catch (err) { console.error(err); }
    };
  </script>
</body>
</html>
