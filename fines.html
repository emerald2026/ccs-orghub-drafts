<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fines — CCS OrgHub Admin</title>

  <link rel="icon" type="image/png" href="ccs.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found. Demo mode.')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
        colors: { purple: {
          950:'#0f041c',900:'#1e0836',850:'#2d0a4e',800:'#3b0764',700:'#581c87',
          600:'#7e22ce',500:'#a855f7',400:'#c084fc',300:'#d8b4fe',200:'#e9d5ff',100:'#f3e8ff',50:'#faf5ff'
        }}
      }}
    }
  </script>
</head>

<body class="h-full font-sans antialiased selection:bg-purple-500 selection:text-white flex overflow-hidden">

  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">
    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">

      <div id="connectionStatus" class="glass-card p-4 rounded-2xl flex items-center gap-3 text-xs">
        <div id="connIcon" class="p-2 rounded-xl bg-amber-500/20 border border-amber-500/30">
          <i data-lucide="wifi" class="w-4 h-4 text-amber-300"></i>
        </div>
        <div>
          <div id="connTitle" class="font-bold text-white">Checking connection...</div>
          <div id="connSub" class="text-purple-300/70">Verifying fines table</div>
        </div>
      </div>

      <!-- STATS -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Total Fines</span>
            <div class="p-2.5 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/30"><i data-lucide="alert-circle" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-white" id="statTotal">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Settled Amount</span>
            <div class="p-2.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
          </div>
          <div class="text-2xl font-extrabold text-emerald-300" id="statSettledAmount">₱0.00</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Outstanding</span>
            <div class="p-2.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/30"><i data-lucide="clock" class="w-5 h-5"></i></div>
          </div>
          <div class="text-2xl font-extrabold text-amber-300" id="statUnpaidAmount">₱0.00</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Unpaid Count</span>
            <div class="p-2.5 rounded-xl bg-red-500/20 text-red-300 border border-red-500/30"><i data-lucide="x-circle" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-red-300" id="statUnpaid">—</div>
        </div>
      </div>

      <!-- TABLE -->
      <div class="glass-card p-6 rounded-3xl space-y-4">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-5 h-5 text-purple-400"></i> Fine Records
          </h3>
          <div class="flex items-center gap-2">
            <button onclick="loadFines()" class="px-3 py-1.5 rounded-lg bg-purple-950/60 hover:bg-purple-800/60 text-purple-200 border border-purple-500/30 text-[11px] font-bold transition-all flex items-center gap-1.5">
              <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
            </button>
            <button onclick="openFineModal()" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-purple-500 to-purple-700 text-white font-bold text-xs shadow-lg shadow-purple-600/40 hover:brightness-110 flex items-center gap-2 border border-purple-400/40">
              <i data-lucide="plus" class="w-4 h-4"></i><span>Issue Fine</span>
            </button>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-purple-300/60"></i>
            <input id="fineSearch" oninput="renderFines()" placeholder="Search student or reason..."
              class="w-full bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white placeholder-purple-300/50 focus:border-purple-400 focus:outline-none" />
          </div>
          <select id="fineFilter" onchange="renderFines()"
            class="bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 px-3 text-xs text-white focus:border-purple-400 focus:outline-none">
            <option value="all">All Status</option>
            <option value="unpaid">Unpaid</option>
            <option value="settled">Settled</option>
            <option value="waived">Waived</option>
          </select>
        </div>

        <div class="overflow-x-auto rounded-2xl border border-purple-500/20">
          <table class="w-full text-left text-xs">
            <thead class="bg-purple-950/80 text-purple-300 uppercase tracking-wider font-semibold border-b border-purple-500/20">
              <tr>
                <th class="py-3.5 px-4">Student</th>
                <th class="py-3.5 px-4">Reason</th>
                <th class="py-3.5 px-4">Amount</th>
                <th class="py-3.5 px-4">Status</th>
                <th class="py-3.5 px-4">Due Date</th>
                <th class="py-3.5 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="finesTable" class="divide-y divide-purple-500/10 text-purple-100">
              <tr><td colspan="6" class="py-8 text-center text-purple-300/60 italic">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ============================================
       TASK 2: FINE RECORDING FORM MODAL
       ============================================ -->
  <div id="modal-fine" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="glass-card w-full max-w-lg rounded-3xl p-6 shadow-2xl border border-purple-400/40 space-y-5 relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal('modal-fine')" class="absolute top-5 right-5 text-purple-300 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="flex items-center space-x-3">
        <div class="p-2.5 rounded-xl bg-purple-600/30 text-purple-300 border border-purple-400/40">
          <i data-lucide="alert-circle" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="text-lg font-bold text-white">Issue New Fine</h3>
          <p class="text-xs text-purple-300/70">Record a violation or penalty</p>
        </div>
      </div>

      <form id="fineForm" onsubmit="saveFine(event)" class="space-y-4 text-xs">

        <div>
          <label class="block font-semibold text-purple-200 mb-1.5 text-[11px] uppercase tracking-wider">Student *</label>
          <select id="fine-student" required
            class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white focus:border-purple-400 focus:outline-none">
            <option value="">— Select Student —</option>
          </select>
        </div>

        <div>
          <label class="block font-semibold text-purple-200 mb-1.5 text-[11px] uppercase tracking-wider">Reason / Violation *</label>
          <input id="fine-reason" required placeholder="e.g. Missed general assembly"
            class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-purple-200 mb-1.5 text-[11px] uppercase tracking-wider">Amount (₱) *</label>
            <input id="fine-amount" type="number" required min="0" step="0.01" placeholder="100.00"
              class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none" />
          </div>
          <div>
            <label class="block font-semibold text-purple-200 mb-1.5 text-[11px] uppercase tracking-wider">Status</label>
            <select id="fine-status"
              class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3 py-2.5 text-sm text-white focus:border-purple-400 focus:outline-none">
              <option value="unpaid" selected>Unpaid</option>
              <option value="settled">Settled</option>
              <option value="waived">Waived</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-semibold text-purple-200 mb-1.5 text-[11px] uppercase tracking-wider">Due Date</label>
          <input id="fine-due" type="date"
            class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white focus:border-purple-400 focus:outline-none" />
        </div>

        <div>
          <label class="block font-semibold text-purple-200 mb-1.5 text-[11px] uppercase tracking-wider">Remarks (optional)</label>
          <textarea id="fine-remarks" rows="2" placeholder="Additional notes..."
            class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none resize-none"></textarea>
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeModal('modal-fine')" class="px-4 py-2 rounded-xl bg-purple-950/60 hover:bg-purple-800/60 text-purple-200 border border-purple-500/30 text-xs font-bold transition-all">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-gradient-to-r from-purple-500 to-purple-700 text-white font-bold text-xs shadow-lg shadow-purple-600/40 hover:brightness-110 flex items-center gap-2 border border-purple-400/40">
            <i data-lucide="save" class="w-4 h-4"></i> Save Fine
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    let fines = [];
    let students = [];

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar('fines');
      document.getElementById('topbar-layer').innerHTML = buildTopbar('Fine Management', 'Record and monitor organizational fines');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      lucide.createIcons();
      initSupabase();
      await checkConnection();

      const ok = await guardAuth();
      if (!ok) return;
      await loadUserProfile();

      await loadStudents();
      await loadFines();
    });

    async function checkConnection() {
      const iconEl = document.getElementById('connIcon');
      const titleEl = document.getElementById('connTitle');
      const subEl = document.getElementById('connSub');

      if (!window.supabaseClient) {
        iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
        iconEl.innerHTML = '<i data-lucide="wifi-off" class="w-4 h-4 text-red-300"></i>';
        titleEl.textContent = 'Supabase NOT connected';
        subEl.textContent = 'Check config.js';
        lucide.createIcons();
        return false;
      }

      try {
        const { error } = await window.supabaseClient.from('fines').select('id').limit(1);
        if (error) {
          iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
          iconEl.innerHTML = '<i data-lucide="alert-circle" class="w-4 h-4 text-red-300"></i>';
          titleEl.textContent = 'Table error: ' + error.message;
          subEl.textContent = 'Run the SQL to create fines table';
        } else {
          iconEl.className = 'p-2 rounded-xl bg-emerald-500/20 border border-emerald-500/30';
          iconEl.innerHTML = '<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-300"></i>';
          titleEl.textContent = 'Supabase connected ✅';
          subEl.textContent = 'Data will persist across refreshes';
        }
        lucide.createIcons();
        return !error;
      } catch (err) {
        titleEl.textContent = 'Connection failed';
        subEl.textContent = err.message;
        return false;
      }
    }

    async function loadStudents() {
      const sel = document.getElementById('fine-student');
      if (!window.supabaseClient) return;

      try {
        const { data } = await window.supabaseClient
          .from('students').select('id, first_name, last_name, student_id').order('last_name');
        students = data || [];
        sel.innerHTML = '<option value="">— Select Student —</option>' +
          students.map(s => `<option value="${s.id}">${s.student_id} — ${s.first_name} ${s.last_name}</option>`).join('');
      } catch { students = []; }
    }

    async function loadFines() {
      const tbody = document.getElementById('finesTable');
      tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-purple-300/60 italic">Loading...</td></tr>`;

      if (!window.supabaseClient) {
        fines = [];
        renderFines(); renderStats();
        return;
      }

      try {
        const { data, error } = await window.supabaseClient
          .from('fines').select('*').order('created_at', { ascending: false });

        if (error) {
          tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-300 italic">Error: ${error.message}</td></tr>`;
          return;
        }

        fines = data || [];
        renderFines(); renderStats();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-300 italic">Error: ${err.message}</td></tr>`;
      }
    }

    function renderStats() {
      const total = fines.length;
      const settledAmount = fines.filter(f => f.status === 'settled').reduce((s, f) => s + (parseFloat(f.amount) || 0), 0);
      const unpaidAmount = fines.filter(f => f.status === 'unpaid').reduce((s, f) => s + (parseFloat(f.amount) || 0), 0);
      const unpaidCount = fines.filter(f => f.status === 'unpaid').length;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statSettledAmount').textContent = '₱' + settledAmount.toFixed(2);
      document.getElementById('statUnpaidAmount').textContent = '₱' + unpaidAmount.toFixed(2);
      document.getElementById('statUnpaid').textContent = unpaidCount;
    }

    function renderFines() {
      const q = (document.getElementById('fineSearch').value || '').toLowerCase();
      const filter = document.getElementById('fineFilter').value;

      const list = fines.filter(f => {
        if (filter !== 'all' && f.status !== filter) return false;
        if (q && !((f.student_name || '') + ' ' + (f.reason || '')).toLowerCase().includes(q)) return false;
        return true;
      });

      const tbody = document.getElementById('finesTable');
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-purple-300/60 italic">No fine records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(f => `
        <tr class="hover:bg-purple-900/30 transition-colors">
          <td class="py-3.5 px-4 font-semibold text-white">${f.student_name || '—'}</td>
          <td class="py-3.5 px-4 text-purple-200">${f.reason || '—'}</td>
          <td class="py-3.5 px-4 text-red-300 font-bold">₱${(parseFloat(f.amount) || 0).toFixed(2)}</td>
          <td class="py-3.5 px-4">
            <span class="px-2 py-1 rounded-full text-[10px] font-bold border
              ${f.status === 'settled' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30' : ''}
              ${f.status === 'unpaid' ? 'bg-red-500/20 text-red-300 border-red-400/30' : ''}
              ${f.status === 'waived' ? 'bg-purple-500/20 text-purple-300 border-purple-400/30' : ''}">
              ${f.status || '—'}
            </span>
          </td>
          <td class="py-3.5 px-4 text-purple-300/80">${f.due_date ? new Date(f.due_date).toLocaleDateString() : '—'}</td>
          <td class="py-3.5 px-4 text-right space-x-1">
            ${f.status === 'unpaid' ? `<button onclick="settleFine(${f.id})" class="px-2.5 py-1 rounded-lg bg-emerald-500/20 hover:bg-emerald-500 text-emerald-300 hover:text-white text-[10px] font-bold border border-emerald-500/30 transition-all">Settle</button>` : ''}
            <button onclick="deleteFine(${f.id})" class="p-1.5 rounded-lg text-purple-400 hover:text-red-300 hover:bg-red-500/20 transition-all">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </td>
        </tr>
      `).join('');
      lucide.createIcons();
    }

    function openFineModal() {
      document.getElementById('fineForm').reset();
      document.getElementById('modal-fine').classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeModal(id) {
      const m = document.getElementById(id);
      if (m) m.classList.add('opacity-0', 'pointer-events-none');
    }

    async function saveFine(event) {
      event.preventDefault();
      if (!window.supabaseClient) {
        showToast('Cannot Save', 'Supabase not connected.');
        return;
      }

      const studentId = document.getElementById('fine-student').value;
      const student = students.find(s => String(s.id) === String(studentId));
      if (!student) {
        showToast('Missing Student', 'Select a valid student.');
        return;
      }

      const payload = {
        student_id: studentId,
        student_name: `${student.first_name} ${student.last_name}`,
        reason: document.getElementById('fine-reason').value.trim(),
        amount: parseFloat(document.getElementById('fine-amount').value) || 0,
        status: document.getElementById('fine-status').value,
        due_date: document.getElementById('fine-due').value || null,
        remarks: document.getElementById('fine-remarks').value.trim() || null,
      };

      try {
        const { error } = await window.supabaseClient.from('fines').insert([payload]).select();
        if (error) { showToast('Save Failed ❌', error.message); return; }

        closeModal('modal-fine');
        await loadFines();
        showToast('Fine Issued ✅', `${payload.student_name} — ₱${payload.amount}`);
      } catch (err) {
        showToast('Save Failed', err.message);
      }
    }

    async function settleFine(id) {
      if (!window.supabaseClient) return;
      try {
        const { error } = await window.supabaseClient.from('fines').update({ status: 'settled' }).eq('id', id);
        if (error) { showToast('Update Failed ❌', error.message); return; }
        await loadFines();
        showToast('Fine Settled ✅', 'Status updated.');
      } catch (err) { showToast('Update Failed', err.message); }
    }

    async function deleteFine(id) {
      if (!confirm('Delete this fine record?')) return;
      if (!window.supabaseClient) return;
      try {
        const { error } = await window.supabaseClient.from('fines').delete().eq('id', id);
        if (error) { showToast('Delete Failed ❌', error.message); return; }
        await loadFines();
        showToast('Fine Deleted ✅', 'Record removed.');
      } catch (err) { showToast('Delete Failed', err.message); }
    }
  </script>

</body>
</html>
