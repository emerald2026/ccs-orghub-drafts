<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students — CCS OrgHub</title>

        <link rel="icon" type="image/png" href="ccs.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
        colors: { purple: {
          950:'#0f041c',900:'#1e0836',850:'#2d0a4e',800:'#3b0764',700:'#581c87',
          600:'#7e22ce',500:'#a855f7',400:'#c084fc',300:'#d8b4fe',200:'#e9d5ff',100:'#f3e8ff',50:'#faf5ff'
        }}
      }}
    }
  </script>
</head>

<body class="h-full font-sans antialiased selection:bg-purple-500 selection:text-white flex overflow-hidden">

  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">
    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">

      <div id="connectionStatus" class="glass-card p-4 rounded-2xl flex items-center gap-3 text-xs">
        <div id="connIcon" class="p-2 rounded-xl bg-amber-500/20 border border-amber-500/30">
          <i data-lucide="wifi" class="w-4 h-4 text-amber-300"></i>
        </div>
        <div>
          <div id="connTitle" class="font-bold text-white">Checking Supabase connection...</div>
          <div id="connSub" class="text-purple-300/70">Verifying database access</div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="glass-card p-5 rounded-2xl">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Total Students</span>
            <div class="p-2.5 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/30">
              <i data-lucide="graduation-cap" class="w-5 h-5"></i>
            </div>
          </div>
          <div class="text-3xl font-extrabold text-white" id="statTotal">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Courses</span>
            <div class="p-2.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
              <i data-lucide="book-open" class="w-5 h-5"></i>
            </div>
          </div>
          <div class="text-3xl font-extrabold text-emerald-300" id="statCourses">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Year Levels</span>
            <div class="p-2.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/30">
              <i data-lucide="layers" class="w-5 h-5"></i>
            </div>
          </div>
          <div class="text-3xl font-extrabold text-amber-300" id="statYears">—</div>
        </div>
      </div>

      <div class="glass-card p-6 rounded-3xl">
        <div class="flex items-center justify-between mb-5">
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="user-plus" class="w-5 h-5 text-purple-400"></i>
            <span id="formTitle">Add Student</span>
          </h3>
          <button onclick="resetForm()" class="px-3 py-1.5 rounded-lg bg-purple-950/60 hover:bg-purple-800/60 text-purple-200 border border-purple-500/30 text-[11px] font-bold transition-all flex items-center gap-1.5">
            <i data-lucide="x-circle" class="w-3.5 h-3.5"></i> Clear
          </button>
        </div>

        <form id="studentForm" class="space-y-4 text-xs">
          <input type="hidden" id="editId">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-purple-200 mb-1 text-[11px] uppercase tracking-wider">Student ID *</label>
              <input type="text" id="studentId" required placeholder="e.g. 2026-0101"
                class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none" />
            </div>
            <div>
              <label class="block font-semibold text-purple-200 mb-1 text-[11px] uppercase tracking-wider">Email</label>
              <input type="email" id="email" placeholder="student@gmail.com"
                class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none" />
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-purple-200 mb-1 text-[11px] uppercase tracking-wider">First Name *</label>
              <input type="text" id="firstName" required placeholder="Juan"
                class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none" />
            </div>
            <div>
              <label class="block font-semibold text-purple-200 mb-1 text-[11px] uppercase tracking-wider">Last Name *</label>
              <input type="text" id="lastName" required placeholder="Dela Cruz"
                class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-purple-300/40 focus:border-purple-400 focus:outline-none" />
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-purple-200 mb-1 text-[11px] uppercase tracking-wider">Course</label>
              <select id="course" class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3 py-2.5 text-sm text-white focus:border-purple-400 focus:outline-none">
                <option value="">— Select Course —</option>
                <option value="BS Computer Science">BS Computer Science</option>
                <option value="BS Information Technology">BS Information Technology</option>
                <option value="BS Entertainment & Multimedia">BS Entertainment & Multimedia</option>
                <option value="Associate in Computer Tech">Associate in Computer Tech</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold text-purple-200 mb-1 text-[11px] uppercase tracking-wider">Year Level</label>
              <select id="yearLevel" class="w-full bg-purple-950/60 border border-purple-500/40 rounded-xl px-3 py-2.5 text-sm text-white focus:border-purple-400 focus:outline-none">
                <option value="">— Select Year —</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
              </select>
            </div>
          </div>
          <div class="flex justify-end pt-2">
            <button type="submit" id="submitBtn"
              class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-purple-500 to-purple-700 text-white font-bold text-xs shadow-lg shadow-purple-600/40 hover:brightness-110 transition-all flex items-center gap-2 border border-purple-400/40 disabled:opacity-50">
              <i data-lucide="save" class="w-4 h-4"></i>
              <span id="submitLabel">Save Student</span>
            </button>
          </div>
        </form>
      </div>

      <div class="glass-card p-5 rounded-3xl">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-purple-300/60"></i>
          <input id="searchStudents" oninput="renderStudents()" placeholder="Search students..."
            class="w-full bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white placeholder-purple-300/50 focus:border-purple-400 focus:outline-none" />
        </div>
      </div>

      <div class="glass-card p-6 rounded-3xl space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="users" class="w-5 h-5 text-purple-400"></i> Student Records
          </h3>
          <button onclick="loadStudents()" class="px-3 py-1.5 rounded-lg bg-purple-950/60 hover:bg-purple-800/60 text-purple-200 border border-purple-500/30 text-[11px] font-bold transition-all flex items-center gap-1.5">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
          </button>
        </div>
        <div class="overflow-x-auto rounded-2xl border border-purple-500/20">
          <table class="w-full text-left text-xs">
            <thead class="bg-purple-950/80 text-purple-300 uppercase tracking-wider font-semibold border-b border-purple-500/20">
              <tr>
                <th class="py-3.5 px-4">Student ID</th>
                <th class="py-3.5 px-4">Name</th>
                <th class="py-3.5 px-4">Email</th>
                <th class="py-3.5 px-4">Course</th>
                <th class="py-3.5 px-4">Year</th>
                <th class="py-3.5 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="studentTable" class="divide-y divide-purple-500/10 text-purple-100">
              <tr><td colspan="6" class="py-8 text-center text-purple-300/60 italic">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    let students = [];

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar('students');
      document.getElementById('topbar-layer').innerHTML = buildTopbar('Students', 'Manage student directory');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      lucide.createIcons();
      initSupabase();

      await checkConnection();

      const ok = await guardAuth();
      if (!ok) return;
      await loadUserProfile();

      await loadStudents();
    });

    async function checkConnection() {
      const iconEl = document.getElementById('connIcon');
      const titleEl = document.getElementById('connTitle');
      const subEl = document.getElementById('connSub');

      if (!window.supabaseClient) {
        iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
        iconEl.innerHTML = '<i data-lucide="wifi-off" class="w-4 h-4 text-red-300"></i>';
        titleEl.textContent = 'Supabase NOT connected';
        subEl.textContent = 'Check config.js';
        lucide.createIcons();
        return false;
      }

      try {
        const { error } = await window.supabaseClient.from('students').select('id').limit(1);

        if (error) {
          iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
          iconEl.innerHTML = '<i data-lucide="alert-circle" class="w-4 h-4 text-red-300"></i>';
          titleEl.textContent = 'Table error: ' + error.message;
          subEl.textContent = 'Check RLS or table name';
        } else {
          iconEl.className = 'p-2 rounded-xl bg-emerald-500/20 border border-emerald-500/30';
          iconEl.innerHTML = '<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-300"></i>';
          titleEl.textContent = 'Supabase connected ✅';
          subEl.textContent = 'Data will persist across refreshes';
        }
        lucide.createIcons();
      } catch (err) {
        titleEl.textContent = 'Connection failed';
        subEl.textContent = err.message;
      }
    }

    async function loadStudents() {
      const tbody = document.getElementById('studentTable');
      tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-purple-300/60 italic">Loading from Supabase...</td></tr>`;

      if (!window.supabaseClient) {
        students = [];
        renderStudents();
        renderStats();
        return;
      }

      try {
        const { data, error } = await window.supabaseClient
          .from('students').select('*').order('id', { ascending: false });

        if (error) {
          tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-300 italic">Error: ${error.message}</td></tr>`;
          return;
        }

        students = data || [];
        renderStudents();
        renderStats();

      } catch (err) {
        showToast('Load Failed', err.message);
      }
    }

    function renderStats() {
      document.getElementById('statTotal').textContent = students.length;
      document.getElementById('statCourses').textContent = new Set(students.map(s => s.course).filter(Boolean)).size;
      document.getElementById('statYears').textContent = new Set(students.map(s => s.year_level).filter(Boolean)).size;
    }

    function renderStudents() {
      const q = (document.getElementById('searchStudents').value || '').toLowerCase();
      const list = students.filter(s => {
        if (!q) return true;
        return `${s.student_id} ${s.first_name} ${s.last_name} ${s.email || ''} ${s.course || ''}`.toLowerCase().includes(q);
      });

      const tbody = document.getElementById('studentTable');
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-purple-300/60 italic">No students found.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(s => `
        <tr class="hover:bg-purple-900/30 transition-colors">
          <td class="py-3.5 px-4 font-mono font-bold text-purple-300">
            <span class="px-2 py-1 rounded-lg bg-purple-500/20 border border-purple-400/30">${s.student_id}</span>
          </td>
          <td class="py-3.5 px-4 font-semibold text-white">${s.first_name} ${s.last_name}</td>
          <td class="py-3.5 px-4 text-purple-200">${s.email || '—'}</td>
          <td class="py-3.5 px-4">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-purple-900/80 border border-purple-500/30">${s.course || '—'}</span>
          </td>
          <td class="py-3.5 px-4 text-purple-300/80">${s.year_level || '—'}</td>
          <td class="py-3.5 px-4 text-right space-x-1">
            <button onclick='editStudent(${JSON.stringify(s).replace(/'/g, "&#39;")})' class="px-2.5 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500 text-amber-300 hover:text-white text-[10px] font-bold border border-amber-500/30">
              Edit
            </button>
            <button onclick="deleteStudent(${s.id})" class="p-1.5 rounded-lg text-purple-400 hover:text-red-300 hover:bg-red-500/20">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </td>
        </tr>
      `).join('');
      lucide.createIcons();
    }

    document.getElementById('studentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;

      const id = document.getElementById('editId').value;
      const payload = {
        student_id: document.getElementById('studentId').value.trim(),
        first_name: document.getElementById('firstName').value.trim(),
        last_name:  document.getElementById('lastName').value.trim(),
        email:      document.getElementById('email').value.trim() || null,
        course:     document.getElementById('course').value.trim() || null,
        year_level: document.getElementById('yearLevel').value.trim() || null
      };

      if (!window.supabaseClient) {
        showToast('Cannot Save', 'Supabase not connected.');
        btn.disabled = false;
        return;
      }

      try {
        let result;
        if (id) {
          result = await window.supabaseClient.from('students').update(payload).eq('id', id).select();
        } else {
          result = await window.supabaseClient.from('students').insert([payload]).select();
        }

        const { error } = result;

        if (error) {
          let msg = error.message;
          if (error.code === '23505') msg = 'Student ID already exists';
          if (error.code === '42P01') msg = 'Table does not exist';
          if (error.code === '42501') msg = 'Permission denied — check RLS';
          showToast('Save Failed ❌', msg);
          btn.disabled = false;
          return;
        }

        await loadStudents();
        resetForm();
        showToast(id ? 'Student Updated ✅' : 'Student Added ✅', `${payload.first_name} ${payload.last_name} saved to database.`);

      } catch (err) {
        showToast('Unexpected Error', err.message);
      } finally {
        btn.disabled = false;
      }
    });

    function editStudent(s) {
      document.getElementById('editId').value    = s.id;
      document.getElementById('studentId').value = s.student_id;
      document.getElementById('firstName').value = s.first_name;
      document.getElementById('lastName').value  = s.last_name;
      document.getElementById('email').value     = s.email || '';
      document.getElementById('course').value    = s.course || '';
      document.getElementById('yearLevel').value = s.year_level || '';
      document.getElementById('formTitle').textContent = 'Edit Student';
      document.getElementById('submitLabel').textContent = 'Update Student';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteStudent(id) {
      if (!confirm('Delete this student?')) return;

      if (!window.supabaseClient) {
        showToast('Cannot Delete', 'Supabase not connected.');
        return;
      }

      try {
        const { error } = await window.supabaseClient.from('students').delete().eq('id', id);
        if (error) {
          showToast('Delete Failed ❌', error.message);
          return;
        }
        await loadStudents();
        showToast('Student Removed ✅', 'Record deleted from Supabase.');
      } catch (err) {
        showToast('Delete Failed', err.message);
      }
    }

    function resetForm() {
      document.getElementById('studentForm').reset();
      document.getElementById('editId').value = '';
      document.getElementById('formTitle').textContent = 'Add Student';
      document.getElementById('submitLabel').textContent = 'Save Student';
    }
  </script>

</body>
</html>
