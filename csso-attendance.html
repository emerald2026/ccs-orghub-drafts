<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSSO Attendance — CCS OrgHub</title>
  <link rel="icon" type="image/png" href="ccs.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found. Demo mode.')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
        colors: { purple: {
          950:'#0f041c',900:'#1e0836',850:'#2d0a4e',800:'#3b0764',
          700:'#581c87',600:'#7e22ce',500:'#a855f7',400:'#c084fc',
          300:'#d8b4fe',200:'#e9d5ff',100:'#f3e8ff',50:'#faf5ff'
        }}
      }}
    }
  </script>
</head>
<body class="h-full font-sans antialiased selection:bg-emerald-500 selection:text-white flex overflow-hidden">

  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">
    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">
      <div id="connectionStatus" class="glass-card p-4 rounded-2xl flex items-center gap-3 text-xs">
        <div id="connIcon" class="p-2 rounded-xl bg-amber-500/20 border border-amber-500/30">
          <i data-lucide="wifi" class="w-4 h-4 text-amber-300"></i>
        </div>
        <div>
          <div id="connTitle" class="font-bold text-white">Checking Supabase connection...</div>
          <div id="connSub" class="text-emerald-300/70">Verifying database access</div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-emerald-300/70">Total Records</span>
            <div class="p-2.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"><i data-lucide="list" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-white" id="attStatTotal">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-emerald-300/70">Present</span>
            <div class="p-2.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-emerald-300" id="attStatPresent">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-emerald-300/70">Late</span>
            <div class="p-2.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/30"><i data-lucide="clock" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-amber-300" id="attStatLate">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-emerald-300/70">Absent</span>
            <div class="p-2.5 rounded-xl bg-red-500/20 text-red-300 border border-red-500/30"><i data-lucide="x-circle" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-red-300" id="attStatAbsent">—</div>
        </div>
      </div>

      <div class="glass-card p-6 rounded-3xl space-y-5">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="clipboard-check" class="w-5 h-5 text-emerald-400"></i> Record CSSO Attendance
          </h3>
          <button onclick="refreshAll()" class="px-3 py-1.5 rounded-lg bg-emerald-950/60 hover:bg-emerald-800/60 text-emerald-200 border border-emerald-500/30 text-[11px] font-bold transition-all flex items-center gap-1.5">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="sm:col-span-2">
            <label class="block font-semibold text-emerald-200 mb-1.5 text-[11px] uppercase tracking-wider">Select Event</label>
            <select id="attendanceEventSelect" onchange="loadAttendanceRoster()"
              class="w-full bg-emerald-950/60 border border-emerald-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white focus:border-emerald-400 focus:outline-none">
              <option value="">— Choose an event —</option>
            </select>
          </div>
          <div class="flex items-end">
            <button onclick="markAllPresent()" id="markAllBtn" disabled
              class="w-full px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
              <i data-lucide="check-check" class="w-4 h-4"></i><span>Mark All Present</span>
            </button>
          </div>
        </div>

        <div class="overflow-x-auto rounded-2xl border border-emerald-500/20">
          <table class="w-full text-left text-xs">
            <thead class="bg-emerald-950/80 text-emerald-300 uppercase tracking-wider font-semibold border-b border-emerald-500/20">
              <tr>
                <th class="py-3.5 px-4">Student ID</th>
                <th class="py-3.5 px-4">Name</th>
                <th class="py-3.5 px-4">Course</th>
                <th class="py-3.5 px-4">Status</th>
                <th class="py-3.5 px-4">Remarks</th>
              </tr>
            </thead>
            <tbody id="attendanceRoster" class="divide-y divide-emerald-500/10 text-emerald-100">
              <tr><td colspan="5" class="py-8 text-center text-emerald-300/60 italic">Select an event to load roster...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="flex justify-end pt-2">
          <button onclick="saveAttendance()" id="saveAttBtn" disabled
            class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-700 text-white font-bold text-xs shadow-lg shadow-emerald-600/40 hover:brightness-110 transition-all flex items-center gap-2 border border-emerald-400/40 disabled:opacity-40 disabled:cursor-not-allowed">
            <i data-lucide="save" class="w-4 h-4"></i><span>Save Attendance</span>
          </button>
        </div>
      </div>

      <div class="glass-card p-6 rounded-3xl space-y-4">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i data-lucide="history" class="w-5 h-5 text-emerald-400"></i> Recent Records
        </h3>
        <div id="attendanceHistory" class="space-y-2">
          <p class="text-center text-emerald-300/60 py-6 text-xs italic">Loading...</p>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    const ORG_CODE = 'CSSO';
    const ORG_LABEL = 'CSSO';
    const ORG_COURSES = ['BS Computer Science'];
    const ACTIVE_PAGE = 'org-attendance';

    let events = [];
    let students = [];
    let attendanceRecords = [];
    let currentAttendanceDraft = {};

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar(ACTIVE_PAGE);
      document.getElementById('topbar-layer').innerHTML = buildTopbar('CSSO Attendance', 'Record and monitor event attendance');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      lucide.createIcons();
      initSupabase();
      await checkConnection();

      const auth = await guardOrgAuth(ORG_CODE);
      if (!auth.ok) return;

      await refreshAll();

      const params = new URLSearchParams(window.location.search);
      const eventId = params.get('event');
      if (eventId) {
        document.getElementById('attendanceEventSelect').value = eventId;
        loadAttendanceRoster();
      }
    });

    async function checkConnection() {
      if (!window.supabaseClient) return;
      try {
        await window.supabaseClient.from('attendance').select('id').limit(1);
      } catch (err) { console.error(err); }
    }

    async function refreshAll() {
      await Promise.all([loadEvents(), loadStudents(), loadAttendanceRecords()]);
      populateEventDropdown();
      renderAttendanceStats();
      renderAttendanceHistory();
    }

    async function loadEvents() {
      if (!window.supabaseClient) return;
      try {
        const { data } = await window.supabaseClient
          .from('events').select('*')
          .or(`org.eq.${ORG_LABEL},org.eq.All`)
          .order('event_date', { ascending: false });
        events = data || [];
      } catch (err) { events = []; }
    }

    async function loadStudents() {
      if (!window.supabaseClient) return;
      try {
        const { data } = await window.supabaseClient
          .from('students').select('*')
          .in('course', ORG_COURSES)
          .order('last_name');
        students = data || [];
      } catch (err) { students = []; }
    }

    async function loadAttendanceRecords() {
      if (!window.supabaseClient) return;
      try {
        const { data } = await window.supabaseClient
          .from('attendance').select('*')
          .eq('org', ORG_LABEL)
          .order('created_at', { ascending: false });
        attendanceRecords = data || [];
      } catch (err) { attendanceRecords = []; }
    }

    function populateEventDropdown() {
      const sel = document.getElementById('attendanceEventSelect');
      const current = sel.value;

      if (events.length === 0) {
        sel.innerHTML = '<option value="">— No events available —</option>';
        return;
      }

      sel.innerHTML = '<option value="">— Choose an event —</option>' +
        events.map(e => {
          const date = e.event_date ? new Date(e.event_date).toLocaleDateString() : '—';
          return `<option value="${e.id}">${e.title} — ${date}</option>`;
        }).join('');

      if (current) sel.value = current;
    }

    function loadAttendanceRoster() {
      const eventId = document.getElementById('attendanceEventSelect').value;
      const tbody = document.getElementById('attendanceRoster');
      const saveBtn = document.getElementById('saveAttBtn');
      const markAllBtn = document.getElementById('markAllBtn');

      if (!eventId) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-emerald-300/60 italic">Select an event to load roster...</td></tr>`;
        saveBtn.disabled = true;
        markAllBtn.disabled = true;
        return;
      }

      if (students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-emerald-300/60 italic">No students in ${ORG_LABEL}.</td></tr>`;
        saveBtn.disabled = true;
        markAllBtn.disabled = true;
        return;
      }

      saveBtn.disabled = false;
      markAllBtn.disabled = false;
      currentAttendanceDraft = {};

      attendanceRecords
        .filter(a => String(a.event_id) === String(eventId))
        .forEach(a => {
          currentAttendanceDraft[a.student_id] = { status: a.status, remarks: a.remarks || '' };
        });

      tbody.innerHTML = students.map(s => {
        const draft = currentAttendanceDraft[s.id] || { status: 'absent', remarks: '' };
        return `
          <tr class="hover:bg-emerald-900/30 transition-colors">
            <td class="py-3 px-4 font-mono font-bold text-emerald-300">
              <span class="px-2 py-1 rounded-lg bg-emerald-500/20 border border-emerald-400/30">${s.student_id || '—'}</span>
            </td>
            <td class="py-3 px-4 font-semibold text-white">${s.first_name} ${s.last_name}</td>
            <td class="py-3 px-4 text-emerald-200">
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-900/80 border border-emerald-500/30">${s.course || '—'}</span>
            </td>
            <td class="py-3 px-4">
              <select onchange="updateAttendanceDraft(${s.id}, 'status', this.value)"
                class="bg-emerald-950/80 border border-emerald-500/40 rounded-lg px-2 py-1 text-[11px] text-white focus:border-emerald-400 focus:outline-none">
                <option value="present" ${draft.status === 'present' ? 'selected' : ''}>Present</option>
                <option value="late" ${draft.status === 'late' ? 'selected' : ''}>Late</option>
                <option value="absent" ${draft.status === 'absent' ? 'selected' : ''}>Absent</option>
                <option value="excused" ${draft.status === 'excused' ? 'selected' : ''}>Excused</option>
              </select>
            </td>
            <td class="py-3 px-4">
              <input type="text" placeholder="Optional..."
                value="${draft.remarks || ''}"
                onchange="updateAttendanceDraft(${s.id}, 'remarks', this.value)"
                class="w-full bg-emerald-950/60 border border-emerald-500/30 rounded-lg px-2 py-1 text-[11px] text-white placeholder-emerald-300/40 focus:border-emerald-400 focus:outline-none" />
            </td>
          </tr>
        `;
      }).join('');
      lucide.createIcons();
    }

    function updateAttendanceDraft(studentId, field, value) {
      if (!currentAttendanceDraft[studentId]) {
        currentAttendanceDraft[studentId] = { status: 'absent', remarks: '' };
      }
      currentAttendanceDraft[studentId][field] = value;
    }

    function markAllPresent() {
      students.forEach(s => {
        currentAttendanceDraft[s.id] = {
          status: 'present',
          remarks: currentAttendanceDraft[s.id]?.remarks || ''
        };
      });
      loadAttendanceRoster();
      showToast('All Present', 'All students marked as present.');
    }

    async function saveAttendance() {
      const eventId = document.getElementById('attendanceEventSelect').value;
      if (!eventId || !window.supabaseClient || students.length === 0) return;

      const saveBtn = document.getElementById('saveAttBtn');
      const originalHTML = saveBtn.innerHTML;
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path></svg><span>Saving...</span>';

      const newRecords = students.map(s => {
        const draft = currentAttendanceDraft[s.id] || { status: 'absent', remarks: '' };
        return {
          org: ORG_LABEL,
          event_id: eventId,
          student_id: s.id,
          student_name: `${s.first_name} ${s.last_name}`,
          status: draft.status,
          remarks: draft.remarks || null,
        };
      });

      try {
        await window.supabaseClient.from('attendance').delete().eq('event_id', eventId).eq('org', ORG_LABEL);
        const { error } = await window.supabaseClient.from('attendance').insert(newRecords);

        if (error) { showToast('Save Failed ❌', error.message); return; }

        await loadAttendanceRecords();
        renderAttendanceStats();
        renderAttendanceHistory();
        showToast('Attendance Saved ✅', `Recorded for ${students.length} students.`);

      } catch (err) {
        showToast('Save Failed', err.message || 'Connection issue.');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalHTML;
        lucide.createIcons();
      }
    }

    function renderAttendanceStats() {
      const total = attendanceRecords.length;
      const present = attendanceRecords.filter(a => a.status === 'present').length;
      const late = attendanceRecords.filter(a => a.status === 'late').length;
      const absent = attendanceRecords.filter(a => a.status === 'absent' || a.status === 'excused').length;

      document.getElementById('attStatTotal').textContent = total;
      document.getElementById('attStatPresent').textContent = present;
      document.getElementById('attStatLate').textContent = late;
      document.getElementById('attStatAbsent').textContent = absent;
    }

    function renderAttendanceHistory() {
      const container = document.getElementById('attendanceHistory');

      if (attendanceRecords.length === 0) {
        container.innerHTML = `<p class="text-center text-emerald-300/60 py-6 text-xs italic">No attendance records yet.</p>`;
        return;
      }

      const grouped = {};
      attendanceRecords.forEach(a => {
        if (!grouped[a.event_id]) grouped[a.event_id] = [];
        grouped[a.event_id].push(a);
      });

      container.innerHTML = Object.entries(grouped).map(([eventId, records]) => {
        const event = events.find(e => String(e.id) === String(eventId));
        const title = event ? event.title : `Event #${eventId}`;
        const present = records.filter(r => r.status === 'present').length;
        const late = records.filter(r => r.status === 'late').length;
        const total = records.length;
        const pct = total ? Math.round((present / total) * 100) : 0;

        return `
          <div class="p-3.5 rounded-2xl bg-emerald-950/60 border border-emerald-500/30 flex items-center justify-between">
            <div>
              <div class="font-bold text-white text-xs">${title}</div>
              <div class="text-[11px] text-emerald-300/70 mt-0.5">${total} students recorded • ${late} late</div>
            </div>
            <div class="text-right">
              <div class="text-emerald-300 font-bold text-sm">${present}/${total}</div>
              <div class="text-[10px] text-emerald-300/70">${pct}% present</div>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
