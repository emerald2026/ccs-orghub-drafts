<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Announcements — CCS OrgHub Student</title>

  <link rel="icon" type="image/png" href="ccs.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found. Demo mode.')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
        colors: { purple: {
          950:'#0f041c',900:'#1e0836',850:'#2d0a4e',800:'#3b0764',700:'#581c87',
          600:'#7e22ce',500:'#a855f7',400:'#c084fc',300:'#d8b4fe',200:'#e9d5ff',100:'#f3e8ff',50:'#faf5ff'
        }}
      }}
    }
  </script>
</head>

<body class="h-full font-sans antialiased selection:bg-purple-500 selection:text-white">

  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">
    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">

      <!-- CONNECTION STATUS -->
      <div id="connectionStatus" class="glass-card p-4 rounded-2xl flex items-center gap-3 text-xs">
        <div id="connIcon" class="p-2 rounded-xl bg-amber-500/20 border border-amber-500/30">
          <i data-lucide="wifi" class="w-4 h-4 text-amber-300"></i>
        </div>
        <div>
          <div id="connTitle" class="font-bold text-white">Loading announcements...</div>
          <div id="connSub" class="text-purple-300/70">Verifying database</div>
        </div>
      </div>

      <!-- ANNOUNCEMENTS FEED -->
      <div class="glass-card p-6 rounded-3xl space-y-4">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="megaphone" class="w-5 h-5 text-purple-400"></i> Latest Updates
          </h3>
          <button onclick="loadAnnouncements()" class="px-3 py-1.5 rounded-lg bg-purple-950/60 hover:bg-purple-800/60 text-purple-200 border border-purple-500/30 text-[11px] font-bold transition-all flex items-center gap-1.5">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
          </button>
        </div>

        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-purple-300/60"></i>
          <input id="searchAnnouncements" oninput="renderAnnouncements()" placeholder="Search announcements..."
            class="w-full bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white placeholder-purple-300/50 focus:border-purple-400 focus:outline-none" />
        </div>

        <div id="announcementsFeed" class="space-y-4">
          <p class="text-center text-purple-300/60 py-6 text-xs italic">Loading...</p>
        </div>
      </div>

    </main>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    let announcements = [];

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar('announcements', 'student');
      document.getElementById('topbar-layer').innerHTML = buildTopbar('Announcements', 'Stay updated with the latest news');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      lucide.createIcons();
      initSupabase();
      await checkConnection();

      const ok = await guardAuth();
      if (!ok) return;
      await loadUserProfile();

      await loadAnnouncements();
    });

    async function checkConnection() {
      const iconEl = document.getElementById('connIcon');
      const titleEl = document.getElementById('connTitle');
      const subEl = document.getElementById('connSub');

      if (!window.supabaseClient) {
        iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
        iconEl.innerHTML = '<i data-lucide="wifi-off" class="w-4 h-4 text-red-300"></i>';
        titleEl.textContent = 'Supabase NOT connected';
        subEl.textContent = 'Check config.js';
        lucide.createIcons();
        return false;
      }

      try {
        const { error } = await window.supabaseClient.from('announcements').select('id').limit(1);
        if (error) {
          iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
          iconEl.innerHTML = '<i data-lucide="alert-circle" class="w-4 h-4 text-red-300"></i>';
          titleEl.textContent = 'Table error: ' + error.message;
          subEl.textContent = 'Check RLS or table name';
        } else {
          iconEl.className = 'p-2 rounded-xl bg-emerald-500/20 border border-emerald-500/30';
          iconEl.innerHTML = '<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-300"></i>';
          titleEl.textContent = 'Connected ✅';
          subEl.textContent = 'Stay updated with the latest news';
        }
        lucide.createIcons();
        return !error;
      } catch (err) {
        titleEl.textContent = 'Connection failed';
        subEl.textContent = err.message;
        return false;
      }
    }

    async function loadAnnouncements() {
      const el = document.getElementById('announcementsFeed');
      el.innerHTML = `<p class="text-center text-purple-300/60 py-6 text-xs italic">Loading...</p>`;

      if (!window.supabaseClient) {
        announcements = [];
        renderAnnouncements();
        return;
      }

      try {
        const { data, error } = await window.supabaseClient
          .from('announcements')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) {
          el.innerHTML = `<p class="text-center text-red-300 py-6 text-xs italic">Error: ${error.message}</p>`;
          return;
        }

        announcements = data || [];
        renderAnnouncements();
      } catch (err) {
        el.innerHTML = `<p class="text-center text-red-300 py-6 text-xs italic">Error: ${err.message}</p>`;
      }
    }

    function renderAnnouncements() {
      const q = (document.getElementById('searchAnnouncements').value || '').toLowerCase();
      const el = document.getElementById('announcementsFeed');

      const list = announcements.filter(a => 
        !q || (a.title || '').toLowerCase().includes(q) || (a.content || '').toLowerCase().includes(q)
      );

      if (list.length === 0) {
        el.innerHTML = `<p class="text-center text-purple-300/60 py-6 text-xs italic">No announcements found.</p>`;
        return;
      }

      el.innerHTML = list.map(a => `
        <div class="p-5 rounded-2xl bg-purple-950/50 border border-purple-500/30 hover:border-purple-400/60 transition-all">
          <div class="flex items-start gap-4">
            <div class="p-2.5 rounded-xl bg-purple-500/20 border border-purple-400/30 shrink-0 mt-1">
              <i data-lucide="megaphone" class="w-5 h-5 text-purple-300"></i>
            </div>
            <div class="flex-1">
              <h4 class="font-bold text-white text-base mb-2">${a.title}</h4>
              <p class="text-sm text-purple-100/90 leading-relaxed mb-3">${a.content || 'No details provided.'}</p>
              <div class="flex items-center gap-1.5 text-[10px] text-purple-300/60 font-semibold uppercase tracking-wider">
                <i data-lucide="clock" class="w-3 h-3"></i>
                ${new Date(a.created_at).toLocaleString()}
              </div>
            </div>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }
  </script>

</body>
</html>
