<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — CCS OrgHub Student</title>

  <link rel="icon" type="image/png" href="ccs.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found. Demo mode.')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
        colors: { purple: {
          950:'#0f041c',900:'#1e0836',850:'#2d0a4e',800:'#3b0764',700:'#581c87',
          600:'#7e22ce',500:'#a855f7',400:'#c084fc',300:'#d8b4fe',200:'#e9d5ff',100:'#f3e8ff',50:'#faf5ff'
        }}
      }}
    }
  </script>
</head>

<body class="h-full font-sans antialiased selection:bg-purple-500 selection:text-white flex overflow-hidden">

  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">
    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">

      <!-- CONNECTION STATUS -->
      <div id="connectionStatus" class="glass-card p-4 rounded-2xl flex items-center gap-3 text-xs">
        <div id="connIcon" class="p-2 rounded-xl bg-amber-500/20 border border-amber-500/30">
          <i data-lucide="wifi" class="w-4 h-4 text-amber-300"></i>
        </div>
        <div>
          <div id="connTitle" class="font-bold text-white">Connecting to events...</div>
          <div id="connSub" class="text-purple-300/70">Verifying database</div>
        </div>
      </div>

      <!-- STATS -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Total Events</span>
            <div class="p-2.5 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/30"><i data-lucide="calendar-days" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-white" id="statTotal">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Upcoming</span>
            <div class="p-2.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"><i data-lucide="clock" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-emerald-300" id="statUpcoming">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Attended</span>
            <div class="p-2.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/30"><i data-lucide="user-check" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-amber-300" id="statAttended">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-purple-300/70">Completed</span>
            <div class="p-2.5 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/30"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-white" id="statCompleted">—</div>
        </div>
      </div>

      <!-- EVENT LIST -->
      <div class="glass-card p-6 rounded-3xl">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4">
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="calendar-days" class="w-5 h-5 text-purple-400"></i> Organizational Events
          </h3>
          <button onclick="loadAll()" class="px-3 py-1.5 rounded-lg bg-purple-950/60 hover:bg-purple-800/60 text-purple-200 border border-purple-500/30 text-[11px] font-bold transition-all flex items-center gap-1.5">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
          </button>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 mb-4">
          <div class="relative flex-1">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-purple-300/60"></i>
            <input id="eventSearch" oninput="renderEvents()" placeholder="Search events..."
              class="w-full bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white placeholder-purple-300/50 focus:border-purple-400 focus:outline-none" />
          </div>
          <select id="eventFilter" onchange="renderEvents()"
            class="bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 px-3 text-xs text-white focus:border-purple-400 focus:outline-none">
            <option value="all">All Status</option>
            <option value="upcoming">Upcoming</option>
            <option value="ongoing">Ongoing</option>
            <option value="completed">Completed</option>
          </select>
        </div>

        <div id="eventsList" class="space-y-3">
          <p class="text-center text-purple-300/60 py-6 text-xs italic">Loading events...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL: EVENT DETAILS -->
  <div id="modal-event" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="glass-card w-full max-w-lg rounded-3xl p-6 shadow-2xl border border-purple-400/40 space-y-5 relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal('modal-event')" class="absolute top-5 right-5 text-purple-300 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="flex items-center space-x-3">
        <div class="p-2.5 rounded-xl bg-purple-600/30 text-purple-300 border border-purple-400/40">
          <i data-lucide="calendar-days" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 id="modal-event-title" class="text-lg font-bold text-white">Event Details</h3>
          <p class="text-xs text-purple-300/70">Full event information</p>
        </div>
      </div>

      <div id="modal-event-body" class="space-y-4 text-xs"></div>

      <div class="pt-2 flex justify-end">
        <button onclick="closeModal('modal-event')" class="px-5 py-2 rounded-xl bg-purple-600 text-white font-bold text-xs hover:bg-purple-500">Close</button>
      </div>
    </div>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    let events = [];
    let myAttendance = [];     // attendance records for current student
    let myStudentNumericId = null;
    let currentProfile = null;

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar('events', 'student');
      document.getElementById('topbar-layer').innerHTML = buildTopbar('Events', 'Organizational events you can attend');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      lucide.createIcons();

      initSupabase();
      await checkConnection();

      const ok = await guardAuth();
      if (!ok) return;

      await loadProfile();
      await loadMyAttendance();
      await loadEvents();
    });

    /* ---------- CONNECTION ---------- */
    async function checkConnection() {
      const iconEl = document.getElementById('connIcon');
      const titleEl = document.getElementById('connTitle');
      const subEl = document.getElementById('connSub');

      if (!window.supabaseClient) {
        iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
        iconEl.innerHTML = '<i data-lucide="wifi-off" class="w-4 h-4 text-red-300"></i>';
        titleEl.textContent = 'Supabase NOT connected';
        subEl.textContent = 'Check config.js';
        lucide.createIcons();
        return false;
      }

      try {
        const { error } = await window.supabaseClient.from('events').select('id').limit(1);
        if (error) {
          iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
          iconEl.innerHTML = '<i data-lucide="alert-circle" class="w-4 h-4 text-red-300"></i>';
          titleEl.textContent = 'Table error: ' + error.message;
          subEl.textContent = 'Check RLS or table';
        } else {
          iconEl.className = 'p-2 rounded-xl bg-emerald-500/20 border border-emerald-500/30';
          iconEl.innerHTML = '<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-300"></i>';
          titleEl.textContent = 'Supabase connected ✅';
          subEl.textContent = 'Events will load below';
        }
        lucide.createIcons();
        return !error;
      } catch (err) {
        titleEl.textContent = 'Connection failed';
        subEl.textContent = err.message;
        return false;
      }
    }

    /* ---------- LOAD PROFILE ---------- */
    async function loadProfile() {
      try {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (!user) return;

        const { data } = await window.supabaseClient
          .from('profiles').select('*').eq('id', user.id).maybeSingle();

        currentProfile = data ? { ...data, email: user.email } : { id: user.id, email: user.email, role: 'student' };
      } catch (e) { console.warn('Profile load failed:', e); }
    }

    /* ---------- HELPER: numeric student id ---------- */
    async function findMyStudentId() {
      if (myStudentNumericId) return myStudentNumericId;
      if (!currentProfile?.student_id) return null;
      try {
        const { data } = await window.supabaseClient
          .from('students').select('id')
          .eq('student_id', currentProfile.student_id)
          .maybeSingle();
        myStudentNumericId = data?.id || null;
        return myStudentNumericId;
      } catch { return null; }
    }

    /* ---------- LOAD MY ATTENDANCE ---------- */
    async function loadMyAttendance() {
      const sid = await findMyStudentId();
      if (!sid) { myAttendance = []; return; }

      try {
        const { data } = await window.supabaseClient
          .from('attendance').select('event_id, status')
          .eq('student_id', sid);
        myAttendance = data || [];
      } catch { myAttendance = []; }
    }

    /* ---------- LOAD ALL ---------- */
    async function loadAll() {
      await loadMyAttendance();
      await loadEvents();
    }

    /* ---------- LOAD EVENTS ---------- */
    async function loadEvents() {
      const container = document.getElementById('eventsList');
      container.innerHTML = `<p class="text-center text-purple-300/60 py-6 text-xs italic">Loading events...</p>`;

      if (!window.supabaseClient) {
        events = [];
        renderEvents();
        return;
      }

      try {
        const { data, error } = await window.supabaseClient
          .from('events').select('*').order('event_date', { ascending: false });

        if (error) {
          container.innerHTML = `<p class="text-center text-red-300 py-6 text-xs italic">Error: ${error.message}</p>`;
          return;
        }

        events = data || [];
        renderEvents();

      } catch (err) {
        container.innerHTML = `<p class="text-center text-red-300 py-6 text-xs italic">Error: ${err.message}</p>`;
      }
    }

    /* ---------- STATS ---------- */
    function renderStats() {
      document.getElementById('statTotal').textContent = events.length;
      document.getElementById('statUpcoming').textContent = events.filter(e => e.status === 'upcoming').length;
      document.getElementById('statAttended').textContent = myAttendance.filter(a => a.status === 'present' || a.status === 'late').length;
      document.getElementById('statCompleted').textContent = events.filter(e => e.status === 'completed').length;
    }

    /* ---------- RENDER ---------- */
    function renderEvents() {
      renderStats();

      const q = (document.getElementById('eventSearch').value || '').toLowerCase();
      const filter = document.getElementById('eventFilter').value;

      const list = events.filter(e => {
        if (filter !== 'all' && e.status !== filter) return false;
        if (q && !((e.title || '') + ' ' + (e.org || '') + ' ' + (e.venue || '')).toLowerCase().includes(q)) return false;
        return true;
      }).sort((a, b) => new Date(b.event_date) - new Date(a.event_date));

      const container = document.getElementById('eventsList');
      if (list.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12">
            <div class="w-16 h-16 mx-auto rounded-full bg-purple-600/20 border border-purple-500/40 flex items-center justify-center text-purple-300 mb-3">
              <i data-lucide="calendar-x" class="w-8 h-8"></i>
            </div>
            <p class="text-purple-300/60 text-sm">No events found.</p>
            <p class="text-purple-300/40 text-xs mt-1">Check back later for new events.</p>
          </div>`;
        lucide.createIcons();
        return;
      }

      const statusColors = {
        upcoming: 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30',
        ongoing: 'bg-amber-500/20 text-amber-300 border-amber-400/30',
        completed: 'bg-purple-500/20 text-purple-300 border-purple-400/30',
        cancelled: 'bg-red-500/20 text-red-300 border-red-400/30'
      };
      const typeIcons = {
        meeting: 'users', seminar: 'presentation', sports: 'trophy',
        community: 'heart-handshake', other: 'star'
      };

      container.innerHTML = list.map(e => {
        const date = e.event_date ? new Date(e.event_date) : null;
        const dateStr = date ? date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
        const timeStr = date ? date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '—';

        // Check if student attended
        const myRecord = myAttendance.find(a => String(a.event_id) === String(e.id));
        const myBadge = myRecord ? `
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border
            ${myRecord.status === 'present' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30' : ''}
            ${myRecord.status === 'late' ? 'bg-amber-500/20 text-amber-300 border-amber-400/30' : ''}
            ${myRecord.status === 'absent' ? 'bg-red-500/20 text-red-300 border-red-400/30' : ''}
            ${myRecord.status === 'excused' ? 'bg-purple-500/20 text-purple-300 border-purple-400/30' : ''}
            flex items-center gap-1">
            <i data-lucide="${myRecord.status === 'present' ? 'check-circle-2' : myRecord.status === 'late' ? 'clock' : myRecord.status === 'absent' ? 'x-circle' : 'info'}" class="w-3 h-3"></i>
            You: ${myRecord.status}
          </span>` : '';

        return `
          <div class="p-4 rounded-2xl bg-purple-950/50 border border-purple-500/30 hover:border-purple-400/60 transition-all cursor-pointer" onclick='openEventDetails(${JSON.stringify(e).replace(/'/g, "&#39;")})'>
            <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
              <div class="flex items-start gap-3 flex-1 min-w-0">
                <div class="p-3 rounded-xl bg-purple-500/20 border border-purple-400/30 shrink-0">
                  <i data-lucide="${typeIcons[e.event_type] || 'calendar'}" class="w-5 h-5 text-purple-300"></i>
                </div>
                <div class="space-y-1 min-w-0 flex-1">
                  <div class="flex items-center gap-2 flex-wrap">
                    <h4 class="font-bold text-white text-sm">${e.title}</h4>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${statusColors[e.status] || ''}">${e.status || '—'}</span>
                    ${myBadge}
                  </div>
                  <p class="text-[11px] text-purple-300/70 line-clamp-2">${e.description || 'No description provided.'}</p>
                  <div class="flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-purple-300/80 pt-1">
                    <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i>${dateStr}</span>
                    <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i>${timeStr}</span>
                    <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i>${e.venue || '—'}</span>
                    <span class="flex items-center gap-1"><i data-lucide="building-2" class="w-3 h-3"></i>${e.org || '—'}</span>
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button class="px-3 py-1.5 rounded-lg bg-purple-600/30 hover:bg-purple-600 text-purple-200 hover:text-white text-[11px] font-bold border border-purple-500/40 transition-all flex items-center gap-1">
                  <i data-lucide="eye" class="w-3 h-3"></i><span>Details</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    /* ---------- EVENT DETAILS MODAL ---------- */
    function openEventDetails(e) {
      const date = e.event_date ? new Date(e.event_date) : null;
      const dateStr = date ? date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) : '—';
      const timeStr = date ? date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '—';

      const myRecord = myAttendance.find(a => String(a.event_id) === String(e.id));

      const statusColors = {
        upcoming: 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30',
        ongoing: 'bg-amber-500/20 text-amber-300 border-amber-400/30',
        completed: 'bg-purple-500/20 text-purple-300 border-purple-400/30',
        cancelled: 'bg-red-500/20 text-red-300 border-red-400/30'
      };

      document.getElementById('modal-event-title').textContent = e.title || 'Event Details';

      document.getElementById('modal-event-body').innerHTML = `
        <div class="flex items-center gap-2 flex-wrap">
          <span class="px-2 py-1 rounded-full text-[10px] font-bold border ${statusColors[e.status] || ''}">${e.status || '—'}</span>
          <span class="px-2 py-1 rounded-full text-[10px] font-bold bg-purple-900/60 text-purple-300 border border-purple-500/30 capitalize">${e.event_type || 'event'}</span>
          ${myRecord ? `
            <span class="px-2 py-1 rounded-full text-[10px] font-bold border
              ${myRecord.status === 'present' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30' : ''}
              ${myRecord.status === 'late' ? 'bg-amber-500/20 text-amber-300 border-amber-400/30' : ''}
              ${myRecord.status === 'absent' ? 'bg-red-500/20 text-red-300 border-red-400/30' : ''}
              ${myRecord.status === 'excused' ? 'bg-purple-500/20 text-purple-300 border-purple-400/30' : ''}">
              Your status: ${myRecord.status}
            </span>` : ''}
        </div>

        ${e.description ? `
          <div>
            <div class="text-[10px] uppercase tracking-wider text-purple-300/70 font-bold mb-1">Description</div>
            <p class="text-purple-100 text-xs leading-relaxed">${e.description}</p>
          </div>` : ''}

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="p-3 rounded-xl bg-purple-950/60 border border-purple-500/30">
            <div class="text-[10px] uppercase tracking-wider text-purple-300/70 font-bold mb-1 flex items-center gap-1">
              <i data-lucide="calendar" class="w-3 h-3"></i> Date
            </div>
            <div class="text-white text-xs font-semibold">${dateStr}</div>
          </div>
          <div class="p-3 rounded-xl bg-purple-950/60 border border-purple-500/30">
            <div class="text-[10px] uppercase tracking-wider text-purple-300/70 font-bold mb-1 flex items-center gap-1">
              <i data-lucide="clock" class="w-3 h-3"></i> Time
            </div>
            <div class="text-white text-xs font-semibold">${timeStr}</div>
          </div>
          <div class="p-3 rounded-xl bg-purple-950/60 border border-purple-500/30">
            <div class="text-[10px] uppercase tracking-wider text-purple-300/70 font-bold mb-1 flex items-center gap-1">
              <i data-lucide="map-pin" class="w-3 h-3"></i> Venue
            </div>
            <div class="text-white text-xs font-semibold">${e.venue || '—'}</div>
          </div>
          <div class="p-3 rounded-xl bg-purple-950/60 border border-purple-500/30">
            <div class="text-[10px] uppercase tracking-wider text-purple-300/70 font-bold mb-1 flex items-center gap-1">
              <i data-lucide="building-2" class="w-3 h-3"></i> Organization
            </div>
            <div class="text-white text-xs font-semibold">${e.org || '—'}</div>
          </div>
        </div>
      `;

      document.getElementById('modal-event').classList.remove('opacity-0', 'pointer-events-none');
      lucide.createIcons();
    }

    /* ---------- MODAL HELPERS ---------- */
    function closeModal(modalId) {
      const m = document.getElementById(modalId);
      if (m) m.classList.add('opacity-0', 'pointer-events-none');
    }
  </script>

</body>
</html>
