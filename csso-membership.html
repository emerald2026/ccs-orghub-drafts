<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSSO Membership — CCS OrgHub</title>
  <link rel="icon" type="image/png" href="ccs.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
        colors: { purple: { 950:'#0f041c',900:'#1e0836',850:'#2d0a4e',800:'#3b0764',700:'#581c87',600:'#7e22ce',500:'#a855f7',400:'#c084fc',300:'#d8b4fe',200:'#e9d5ff',100:'#f3e8ff',50:'#faf5ff' }}
      }}
    }
  </script>
</head>
<body class="h-full font-sans antialiased selection:bg-emerald-500 selection:text-white flex overflow-hidden">

  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">
    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">
      <div class="glass-card p-6 rounded-3xl space-y-4">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <div>
            <h3 class="text-base font-bold text-white flex items-center gap-2">
              <i data-lucide="user-check" class="w-5 h-5 text-emerald-400"></i> CSSO Membership Approvals
            </h3>
            <p class="text-xs text-emerald-300/70">Approve or manage students joining the organization</p>
          </div>
          <div class="flex items-center gap-2">
            <div class="relative w-full sm:w-64">
              <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-emerald-300/60"></i>
              <input id="memberSearch" oninput="renderMembers()" placeholder="Search student..."
                class="w-full bg-emerald-950/60 border border-emerald-500/30 rounded-xl py-2.5 pl-9 pr-10 text-xs text-white placeholder-emerald-300/50 focus:border-emerald-400 focus:outline-none" />
            </div>
            <button onclick="loadMemberships()" class="px-3 py-2.5 rounded-xl bg-emerald-950/60 hover:bg-emerald-800/60 text-emerald-200 border border-emerald-500/30 text-[11px] font-bold transition-all flex items-center gap-1.5">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        
        <div class="overflow-x-auto rounded-2xl border border-emerald-500/20">
          <table class="w-full text-left text-xs">
            <thead class="bg-emerald-950/80 text-emerald-300 uppercase tracking-wider font-semibold border-b border-emerald-500/20">
              <tr>
                <th class="py-3.5 px-4">Student Name</th>
                <th class="py-3.5 px-4">Course</th>
                <th class="py-3.5 px-4">Status</th>
                <th class="py-3.5 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="membershipTable" class="divide-y divide-emerald-500/10 text-emerald-100">
              <tr><td colspan="4" class="py-8 text-center text-emerald-300/60 italic">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    const ORG_CODE = 'CSSO';
    const ORG_LABEL = 'CSSO';
    const ACTIVE_PAGE = 'org-membership';

    let membershipsData = [];

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar(ACTIVE_PAGE);
      document.getElementById('topbar-layer').innerHTML = buildTopbar('CSSO Membership', 'Approve and manage members');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      lucide.createIcons();
      initSupabase();
      
      const auth = await guardOrgAuth(ORG_CODE);
      if (!auth.ok) return;
      
      await loadMemberships();
    });

    async function loadMemberships() {
      if (!window.supabaseClient) return;
      const tbody = document.getElementById('membershipTable');
      
      try {
        const { data, error } = await window.supabaseClient
          .from('memberships')
          .select('*')
          .eq('org', ORG_LABEL)
          .order('created_at', { ascending: false });

        if (error) throw error;

        membershipsData = data || [];
        renderMembers();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-red-300 italic">Error loading data.</td></tr>`;
      }
      lucide.createIcons();
    }

    function renderMembers() {
      const q = (document.getElementById('memberSearch').value || '').toLowerCase().trim();
      const list = membershipsData.filter(m => !q || `${m.student_name || ''}`.toLowerCase().includes(q));
      const tbody = document.getElementById('membershipTable');

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-emerald-300/60 italic">No membership records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(m => `
        <tr class="hover:bg-emerald-900/30 transition-colors">
          <td class="py-3.5 px-4 font-semibold text-white">${m.student_name || '—'}</td>
          <td class="py-3.5 px-4 text-emerald-200">${m.course || '—'}</td>
          <td class="py-3.5 px-4">
            <span class="px-2 py-1 rounded-full text-[10px] font-bold border 
              ${m.status === 'active' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30' : ''}
              ${m.status === 'pending' ? 'bg-amber-500/20 text-amber-300 border-amber-400/30' : ''}
              ${m.status === 'rejected' ? 'bg-red-500/20 text-red-300 border-red-400/30' : ''}">
              ${m.status || 'pending'}
            </span>
          </td>
          <td class="py-3.5 px-4 text-right space-x-1">
            ${m.status === 'pending' ? `
              <button onclick="updateStatus(${m.id}, 'active')" class="px-2.5 py-1 rounded-lg bg-emerald-500/20 hover:bg-emerald-500 text-emerald-300 hover:text-white text-[10px] font-bold border border-emerald-500/30 transition-all">Approve</button>
              <button onclick="updateStatus(${m.id}, 'rejected')" class="px-2.5 py-1 rounded-lg bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white text-[10px] font-bold border border-red-500/30 transition-all">Reject</button>
            ` : ''}
            <button onclick="deleteMembership(${m.id})" class="p-1.5 rounded-lg text-emerald-400 hover:text-red-300 hover:bg-red-500/20 transition-all">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </td>
        </tr>
      `).join('');
      lucide.createIcons();
    }

    async function updateStatus(id, status) {
      if (!window.supabaseClient) return;
      try {
        const { error } = await window.supabaseClient
          .from('memberships')
          .update({ status })
          .eq('id', id);

        if (error) throw error;
        
        showToast('Success', `Member marked as ${status}.`);
        await loadMemberships();
      } catch (err) {
        showToast('Error', err.message);
      }
    }

    async function deleteMembership(id) {
      if (!confirm('Delete this membership record?')) return;
      if (!window.supabaseClient) return;
      try {
        const { error } = await window.supabaseClient
          .from('memberships')
          .delete()
          .eq('id', id);

        if (error) throw error;
        
        showToast('Deleted', `Membership removed.`);
        await loadMemberships();
      } catch (err) {
        showToast('Error', err.message);
      }
    }
  </script>
</body>
</html>
