<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Organizations — CCS OrgHub Student</title>

  <link rel="icon" type="image/png" href="ccs.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found. Demo mode.')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
        colors: { purple: {
          950:'#0f041c',900:'#1e0836',850:'#2d0a4e',800:'#3b0764',700:'#581c87',
          600:'#7e22ce',500:'#a855f7',400:'#c084fc',300:'#d8b4fe',200:'#e9d5ff',100:'#f3e8ff',50:'#faf5ff'
        }}
      }}
    }
  </script>
</head>

<body class="h-full font-sans antialiased selection:bg-purple-500 selection:text-white">

  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">
    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">

      <!-- CONNECTION STATUS -->
      <div id="connectionStatus" class="glass-card p-4 rounded-2xl flex items-center gap-3 text-xs">
        <div id="connIcon" class="p-2 rounded-xl bg-amber-500/20 border border-amber-500/30">
          <i data-lucide="wifi" class="w-4 h-4 text-amber-300"></i>
        </div>
        <div>
          <div id="connTitle" class="font-bold text-white">Loading organizations...</div>
          <div id="connSub" class="text-purple-300/70">Verifying database</div>
        </div>
      </div>

      <!-- SEARCH -->
      <div class="glass-card p-5 rounded-3xl">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-purple-300/60"></i>
          <input id="searchOrgs" oninput="renderOrganizations()" placeholder="Search organizations..."
            class="w-full bg-purple-950/60 border border-purple-500/30 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white placeholder-purple-300/50 focus:border-purple-400 focus:outline-none" />
        </div>
      </div>

      <!-- ORG GRID -->
      <div class="glass-card p-6 rounded-3xl space-y-4">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i data-lucide="building-2" class="w-5 h-5 text-purple-400"></i> Available Organizations
        </h3>

        <div id="orgsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <p class="text-center text-purple-300/60 py-6 text-xs italic col-span-full">Loading...</p>
        </div>
      </div>

    </main>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    let organizations = [];
    let myMemberships = [];
    let currentProfile = null;

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar('organizations', 'student');
      document.getElementById('topbar-layer').innerHTML = buildTopbar('Browse Organizations', 'Find and join student organizations');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      lucide.createIcons();
      initSupabase();
      await checkConnection();

      const ok = await guardAuth();
      if (!ok) return;

      await loadProfile();
      await loadData();
    });

    async function checkConnection() {
      const iconEl = document.getElementById('connIcon');
      const titleEl = document.getElementById('connTitle');
      const subEl = document.getElementById('connSub');

      if (!window.supabaseClient) {
        iconEl.className = 'p-2 rounded-xl bg-red-500/20 border border-red-500/30';
        iconEl.innerHTML = '<i data-lucide="wifi-off" class="w-4 h-4 text-red-300"></i>';
        titleEl.textContent = 'Supabase NOT connected';
        subEl.textContent = 'Check config.js';
        lucide.createIcons();
        return false;
      }

      try {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (!user) { titleEl.textContent = 'Not logged in'; return false; }

        iconEl.className = 'p-2 rounded-xl bg-emerald-500/20 border border-emerald-500/30';
        iconEl.innerHTML = '<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-300"></i>';
        titleEl.textContent = 'Connected as ' + user.email;
        subEl.textContent = 'Browse and join organizations';
        lucide.createIcons();
        return true;
      } catch (err) {
        titleEl.textContent = 'Connection failed';
        subEl.textContent = err.message;
        return false;
      }
    }

    async function loadProfile() {
      try {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (!user) return;
        const { data } = await window.supabaseClient
          .from('profiles').select('*').eq('id', user.id).maybeSingle();
        currentProfile = data || { id: user.id, email: user.email, role: 'student' };
      } catch (e) { console.warn('Profile load failed:', e); }
    }

    async function loadData() {
      if (!window.supabaseClient) return;

      // 1. Fetch Organizations
      try {
        const { data, error } = await window.supabaseClient
          .from('organizations')
          .select('*')
          .order('name', { ascending: true });
        if (!error && data) organizations = data;
      } catch (e) { console.warn(e); }

      // 2. Fetch My Memberships (to show "Joined" status)
      if (currentProfile) {
        try {
          const { data, error } = await window.supabaseClient
            .from('memberships')
            .select('org')
            .eq('student_id', currentProfile.id);
          if (!error && data) myMemberships = data.map(m => m.org);
        } catch (e) { console.warn(e); }
      }

      renderOrganizations();
    }

    function renderOrganizations() {
      const q = (document.getElementById('searchOrgs').value || '').toLowerCase();
      const grid = document.getElementById('orgsGrid');

      const list = organizations.filter(o => 
        !q || (o.name || '').toLowerCase().includes(q)
      );

      if (list.length === 0) {
        grid.innerHTML = `<p class="text-center text-purple-300/60 py-6 text-xs italic col-span-full">No organizations found.</p>`;
        return;
      }

      grid.innerHTML = list.map(o => {
        const isJoined = myMemberships.includes(o.name);
        
        return `
        <div class="p-5 rounded-2xl bg-purple-950/50 border border-purple-500/30 hover:border-purple-400/60 transition-all flex flex-col justify-between gap-4">
          <div>
            <h4 class="font-bold text-white text-base mb-2">${o.name || 'Unknown Org'}</h4>
            <p class="text-xs text-purple-200/70 line-clamp-3 mb-3">${o.description || 'No description provided.'}</p>
            <div class="text-[10px] text-purple-300/70 flex items-center gap-1.5">
              <i data-lucide="user" class="w-3 h-3"></i> Adviser: ${o.adviser || 'Not assigned'}
            </div>
          </div>
          <div class="border-t border-purple-500/20 pt-3">
            <button onclick="joinOrg('${o.name}')" ${isJoined ? 'disabled' : ''} 
              class="w-full py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5
              ${isJoined ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 cursor-not-allowed' : 'bg-purple-600 hover:bg-purple-500 text-white shadow-lg shadow-purple-600/30'}">
              ${isJoined 
                ? '<i data-lucide="check" class="w-3.5 h-3.5"></i> Already Joined / Pending' 
                : '<i data-lucide="plus" class="w-3.5 h-3.5"></i> Join Organization'}
            </button>
          </div>
        </div>
      `}).join('');
      lucide.createIcons();
    }

    async function joinOrg(orgName) {
      if (!window.supabaseClient || !currentProfile) return;

      const name = `${currentProfile.first_name || ''} ${currentProfile.last_name || ''}`.trim();

      try {
        const { error } = await window.supabaseClient
          .from('memberships')
          .insert([{
            student_id: currentProfile.id,
            student_name: name,
            org: orgName,
            role: 'Member',
            status: 'pending'
          }]);

        if (error) {
          showToast('Join Failed ❌', error.message);
          return;
        }

        showToast('Request Sent ✅', 'Waiting for admin approval.');
        
        // Refresh the list to disable the button
        await loadData();

      } catch (err) {
        showToast('Join Failed', err.message);
      }
    }
  </script>

</body>
</html>
