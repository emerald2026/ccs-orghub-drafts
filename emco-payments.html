<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMCO Payments — CCS OrgHub</title>
  <link rel="icon" type="image/png" href="ccs.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="console.warn('config.js not found')"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="shared.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
        colors: { purple: { 950:'#0f041c',900:'#1e0836',850:'#2d0a4e',800:'#3b0764',700:'#581c87',600:'#7e22ce',500:'#a855f7',400:'#c084fc',300:'#d8b4fe',200:'#e9d5ff',100:'#f3e8ff',50:'#faf5ff' }}
      }}
    }
  </script>
</head>
<body class="h-full font-sans antialiased selection:bg-fuchsia-500 selection:text-white flex overflow-hidden">

  <div id="bg-layer"></div>
  <div id="sidebar-layer"></div>

  <div class="flex-1 lg:ml-64 flex flex-col min-h-screen relative z-10 overflow-x-hidden">
    <div id="topbar-layer"></div>

    <main class="flex-1 p-4 md:p-8 space-y-6">
      <div id="connectionStatus" class="glass-card p-4 rounded-2xl flex items-center gap-3 text-xs">
        <div id="connIcon" class="p-2 rounded-xl bg-amber-500/20 border border-amber-500/30">
          <i data-lucide="wifi" class="w-4 h-4 text-amber-300"></i>
        </div>
        <div>
          <div id="connTitle" class="font-bold text-white">Checking connection...</div>
          <div id="connSub" class="text-fuchsia-300/70">Verifying payments table</div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-fuchsia-300/70">Total Payments</span>
            <div class="p-2.5 rounded-xl bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-500/30"><i data-lucide="wallet" class="w-5 h-5"></i></div>
          </div>
          <div class="text-3xl font-extrabold text-white" id="statTotal">—</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-fuchsia-300/70">Total Collected</span>
            <div class="p-2.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
          </div>
          <div class="text-2xl font-extrabold text-emerald-300" id="statCollected">₱0.00</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-fuchsia-300/70">Fees Payments</span>
            <div class="p-2.5 rounded-xl bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-500/30"><i data-lucide="receipt" class="w-5 h-5"></i></div>
          </div>
          <div class="text-2xl font-extrabold text-fuchsia-300" id="statFees">₱0.00</div>
        </div>
        <div class="glass-card p-5 rounded-2xl hover:-translate-y-1 transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-fuchsia-300/70">Fines Payments</span>
            <div class="p-2.5 rounded-xl bg-red-500/20 text-red-300 border border-red-500/30"><i data-lucide="alert-circle" class="w-5 h-5"></i></div>
          </div>
          <div class="text-2xl font-extrabold text-red-300" id="statFines">₱0.00</div>
        </div>
      </div>

      <div class="glass-card p-6 rounded-3xl space-y-4">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="wallet" class="w-5 h-5 text-fuchsia-400"></i> EMCO Payment Records
          </h3>
          <div class="flex items-center gap-2">
            <button onclick="loadAll()" class="px-3 py-1.5 rounded-lg bg-fuchsia-950/60 hover:bg-fuchsia-800/60 text-fuchsia-200 border border-fuchsia-500/30 text-[11px] font-bold transition-all flex items-center gap-1.5">
              <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
            </button>
            <button onclick="openPaymentModal()" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-fuchsia-500 to-fuchsia-700 text-white font-bold text-xs shadow-lg shadow-fuchsia-600/40 hover:brightness-110 flex items-center gap-2 border border-fuchsia-400/40">
              <i data-lucide="plus" class="w-4 h-4"></i><span>Record Payment</span>
            </button>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-fuchsia-300/60"></i>
            <input id="paymentSearch" oninput="renderPayments()" placeholder="Search by student, reference, type, or method..."
              class="w-full bg-fuchsia-950/60 border border-fuchsia-500/30 rounded-xl py-2.5 pl-9 pr-10 text-xs text-white placeholder-fuchsia-300/50 focus:border-fuchsia-400 focus:outline-none" />
            <button type="button" id="paymentSearchClearBtn" onclick="clearPaymentSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-fuchsia-300 hover:text-white p-1" title="Clear search">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <select id="paymentTypeFilter" onchange="renderPayments()"
            class="bg-fuchsia-950/60 border border-fuchsia-500/30 rounded-xl py-2.5 px-3 text-xs text-white focus:border-fuchsia-400 focus:outline-none">
            <option value="all">All Types</option>
            <option value="fee">Fees</option>
            <option value="fine">Fines</option>
          </select>
          <select id="paymentMethodFilter" onchange="renderPayments()"
            class="bg-fuchsia-950/60 border border-fuchsia-500/30 rounded-xl py-2.5 px-3 text-xs text-white focus:border-fuchsia-400 focus:outline-none">
            <option value="all">All Methods</option>
            <option value="cash">Cash</option>
            <option value="gcash">GCash</option>
            <option value="bank">Bank Transfer</option>
            <option value="other">Other</option>
          </select>
        </div>

        <p id="paymentCountLabel" class="text-[11px] text-fuchsia-300/60 px-1"></p>

        <div class="overflow-x-auto rounded-2xl border border-fuchsia-500/20">
          <table class="w-full text-left text-xs">
            <thead class="bg-fuchsia-950/80 text-fuchsia-300 uppercase tracking-wider font-semibold border-b border-fuchsia-500/20">
              <tr>
                <th class="py-3.5 px-4">Student</th>
                <th class="py-3.5 px-4">Type</th>
                <th class="py-3.5 px-4">Reference</th>
                <th class="py-3.5 px-4">Amount Paid</th>
                <th class="py-3.5 px-4">Method</th>
                <th class="py-3.5 px-4">Date</th>
                <th class="py-3.5 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="paymentsTable" class="divide-y divide-fuchsia-500/10 text-fuchsia-100">
              <tr><td colspan="7" class="py-8 text-center text-fuchsia-300/60 italic">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-payment" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="glass-card w-full max-w-lg rounded-3xl p-6 shadow-2xl border border-fuchsia-400/40 space-y-5 relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal('modal-payment')" class="absolute top-5 right-5 text-fuchsia-300 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="flex items-center space-x-3">
        <div class="p-2.5 rounded-xl bg-fuchsia-600/30 text-fuchsia-300 border border-fuchsia-400/40">
          <i data-lucide="wallet" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="text-lg font-bold text-white">Record EMCO Payment</h3>
          <p class="text-xs text-fuchsia-300/70">Apply a payment to a fee or fine</p>
        </div>
      </div>

      <form id="paymentForm" onsubmit="savePayment(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-fuchsia-200 mb-1.5 text-[11px] uppercase tracking-wider">Payment For *</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="typeBtn-fee" onclick="setPaymentType('fee')"
              class="px-3 py-2.5 rounded-xl border text-xs font-bold transition-all flex items-center justify-center gap-2 bg-fuchsia-600 text-white border-fuchsia-400/50">
              <i data-lucide="receipt" class="w-4 h-4"></i> Fee
            </button>
            <button type="button" id="typeBtn-fine" onclick="setPaymentType('fine')"
              class="px-3 py-2.5 rounded-xl border text-xs font-bold transition-all flex items-center justify-center gap-2 bg-fuchsia-950/60 text-fuchsia-300 border-fuchsia-500/30">
              <i data-lucide="alert-circle" class="w-4 h-4"></i> Fine
            </button>
          </div>
        </div>

        <div>
          <label class="block font-semibold text-fuchsia-200 mb-1.5 text-[11px] uppercase tracking-wider">Student *</label>
          <input type="hidden" id="payment-student" />
          <div id="selectedPayStudentChip" class="hidden mb-2 flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-fuchsia-600/20 border border-fuchsia-400/40">
            <div class="flex items-center gap-2 min-w-0">
              <div class="p-1 rounded-lg bg-fuchsia-500/30 text-fuchsia-200"><i data-lucide="user-check" class="w-3.5 h-3.5"></i></div>
              <span id="selectedPayStudentLabel" class="text-xs font-semibold text-white truncate"></span>
            </div>
            <button type="button" onclick="clearSelectedPayStudent()" class="text-fuchsia-300 hover:text-white p-0.5" title="Clear selection"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
          </div>
          <div class="relative">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-fuchsia-300/60"></i>
            <input type="text" id="payStudentPickerSearch" autocomplete="off" placeholder="Search student by name or ID..."
              oninput="renderPayStudentPicker(this.value)" onfocus="renderPayStudentPicker(this.value)"
              class="w-full bg-fuchsia-950/60 border border-fuchsia-500/40 rounded-xl px-3.5 py-2.5 pl-9 text-sm text-white placeholder-fuchsia-300/40 focus:border-fuchsia-400 focus:outline-none" />
          </div>
          <div id="payStudentPickerList" class="mt-1.5 max-h-40 overflow-y-auto rounded-xl border border-fuchsia-500/30 bg-fuchsia-950/80 divide-y divide-fuchsia-500/10 text-xs"></div>
        </div>

        <div>
          <label class="block font-semibold text-fuchsia-200 mb-1.5 text-[11px] uppercase tracking-wider">
            Select <span id="chargeTypeLabel">Fee</span> *
          </label>
          <input type="hidden" id="payment-charge" />
          <div id="selectedChargeChip" class="hidden mb-2 px-3 py-2 rounded-xl bg-emerald-600/15 border border-emerald-400/40">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div id="selectedChargeTitle" class="text-xs font-semibold text-white truncate"></div>
                <div id="selectedChargeMeta" class="text-[10px] text-emerald-200/80 mt-0.5"></div>
              </div>
              <button type="button" onclick="clearSelectedCharge()" class="text-emerald-300 hover:text-white p-0.5 shrink-0" title="Clear charge"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
            </div>
          </div>
          <div class="relative">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-fuchsia-300/60"></i>
            <input type="text" id="chargePickerSearch" autocomplete="off" placeholder="Search open charges..."
              oninput="renderChargePicker(this.value)" onfocus="renderChargePicker(this.value)"
              class="w-full bg-fuchsia-950/60 border border-fuchsia-500/40 rounded-xl px-3.5 py-2.5 pl-9 text-sm text-white placeholder-fuchsia-300/40 focus:border-fuchsia-400 focus:outline-none" />
          </div>
          <div id="chargePickerList" class="mt-1.5 max-h-40 overflow-y-auto rounded-xl border border-fuchsia-500/30 bg-fuchsia-950/80 divide-y divide-fuchsia-500/10 text-xs">
            <div class="px-3 py-3 text-center text-fuchsia-300/60 italic">Select a student first.</div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-fuchsia-200 mb-1.5 text-[11px] uppercase tracking-wider">Amount Paid (₱) *</label>
            <input id="payment-amount" type="number" required min="0" step="0.01" placeholder="0.00"
              class="w-full bg-fuchsia-950/60 border border-fuchsia-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-fuchsia-300/40 focus:border-fuchsia-400 focus:outline-none" />
            <p id="paymentBalanceHint" class="text-[10px] text-fuchsia-300/70 mt-1"></p>
          </div>
          <div>
            <label class="block font-semibold text-fuchsia-200 mb-1.5 text-[11px] uppercase tracking-wider">Method</label>
            <select id="payment-method" class="w-full bg-fuchsia-950/60 border border-fuchsia-500/40 rounded-xl px-3 py-2.5 text-sm text-white focus:border-fuchsia-400 focus:outline-none">
              <option value="cash">Cash</option>
              <option value="gcash">GCash</option>
              <option value="bank">Bank Transfer</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-fuchsia-200 mb-1.5 text-[11px] uppercase tracking-wider">Payment Date</label>
            <input id="payment-date" type="date" class="w-full bg-fuchsia-950/60 border border-fuchsia-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white focus:border-fuchsia-400 focus:outline-none" />
          </div>
          <div>
            <label class="block font-semibold text-fuchsia-200 mb-1.5 text-[11px] uppercase tracking-wider">Reference No.</label>
            <input id="payment-ref" placeholder="e.g. GC-123456" class="w-full bg-fuchsia-950/60 border border-fuchsia-500/40 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-fuchsia-300/40 focus:border-fuchsia-400 focus:outline-none" />
          </div>
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeModal('modal-payment')" class="px-4 py-2 rounded-xl bg-fuchsia-950/60 hover:bg-fuchsia-800/60 text-fuchsia-200 border border-fuchsia-500/30 text-xs font-bold transition-all">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-gradient-to-r from-fuchsia-500 to-fuchsia-700 text-white font-bold text-xs shadow-lg shadow-fuchsia-600/40 hover:brightness-110 flex items-center gap-2 border border-fuchsia-400/40">
            <i data-lucide="save" class="w-4 h-4"></i> Save Payment
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="modal-layer"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <script src="shared.js"></script>
  <script>
    const ORG_CODE = 'EMCO';
    const ORG_LABEL = 'EMCO';
    const ORG_COURSES = ['BS Entertainment & Multimedia'];
    const ACTIVE_PAGE = 'org-payments';

    let payments = [];
    let students = [];
    let openFees = [];
    let openFines = [];

    let paymentType = 'fee';
    let selectedPayStudent = null;
    let selectedCharge = null;

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('bg-layer').innerHTML = buildBackground();
      document.getElementById('sidebar-layer').innerHTML = buildSidebar(ACTIVE_PAGE);
      document.getElementById('topbar-layer').innerHTML = buildTopbar('EMCO Payments', 'Record and monitor student payments');
      document.getElementById('modal-layer').innerHTML = buildLogoutModal();

      const dateInput = document.getElementById('payment-date');
      if (dateInput) dateInput.value = new Date().toISOString().slice(0, 10);

      lucide.createIcons();
      initSupabase();
      
      const auth = await guardOrgAuth(ORG_CODE);
      if (!auth.ok) return;
      
      await loadAll();
    });

    async function loadAll() {
      await Promise.all([loadStudents(), loadCharges(), loadPayments()]);
    }

    async function loadStudents() {
      if (!window.supabaseClient) return;
      try {
        const { data } = await window.supabaseClient
          .from('students')
          .select('id, first_name, last_name, student_id')
          .in('course', ORG_COURSES)
          .order('first_name', { ascending: true });

        students = (data || []).slice().sort((a, b) => {
          const fa = `${a.first_name || ''} ${a.last_name || ''}`.trim().toLowerCase();
          const fb = `${b.first_name || ''} ${b.last_name || ''}`.trim().toLowerCase();
          return fa.localeCompare(fb, undefined, { sensitivity: 'base' });
        });
      } catch { students = []; }
    }

    async function loadCharges() {
      if (!window.supabaseClient) return;
      try {
        const { data: feesData } = await window.supabaseClient.from('fees').select('*').eq('org', ORG_LABEL).in('status', ['unpaid']);
        openFees = feesData || [];
      } catch { openFees = []; }

      try {
        const { data: finesData } = await window.supabaseClient.from('fines').select('*').eq('org', ORG_LABEL).in('status', ['unpaid']);
        openFines = finesData || [];
      } catch { openFines = []; }
    }

    async function loadPayments() {
      const tbody = document.getElementById('paymentsTable');
      tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-fuchsia-300/60 italic">Loading...</td></tr>`;

      if (!window.supabaseClient) return;

      try {
        const { data, error } = await window.supabaseClient
          .from('payments')
          .select('*')
          .eq('org', ORG_LABEL)
          .order('student_name', { ascending: true });

        if (error) {
          tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-red-300 italic">Error: ${error.message}</td></tr>`;
          return;
        }

        payments = (data || []).slice().sort((a, b) => {
          const fa = (a.student_name || '').trim().toLowerCase();
          const fb = (b.student_name || '').trim().toLowerCase();
          return fa.localeCompare(fb, undefined, { sensitivity: 'base' });
        });

        renderPayments(); renderStats();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-red-300 italic">Error: ${err.message}</td></tr>`;
      }
    }

    function renderStats() {
      const total = payments.length;
      const collected = payments.reduce((s, p) => s + (parseFloat(p.amount) || 0), 0);
      const feeTotal = payments.filter(p => p.type === 'fee').reduce((s, p) => s + (parseFloat(p.amount) || 0), 0);
      const fineTotal = payments.filter(p => p.type === 'fine').reduce((s, p) => s + (parseFloat(p.amount) || 0), 0);

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statCollected').textContent = '₱' + collected.toFixed(2);
      document.getElementById('statFees').textContent = '₱' + feeTotal.toFixed(2);
      document.getElementById('statFines').textContent = '₱' + fineTotal.toFixed(2);
    }

    function renderPayments() {
      const q = (document.getElementById('paymentSearch').value || '').toLowerCase().trim();
      const typeFilter = document.getElementById('paymentTypeFilter').value;
      const methodFilter = document.getElementById('paymentMethodFilter').value;

      const clearBtn = document.getElementById('paymentSearchClearBtn');
      if (clearBtn) clearBtn.classList.toggle('hidden', !q);

      const list = payments.filter(p => {
        if (typeFilter !== 'all' && p.type !== typeFilter) return false;
        if (methodFilter !== 'all' && p.method !== methodFilter) return false;
        if (!q) return true;
        const haystack = [
          p.student_name || '', p.type || '', p.method || '', p.reference || '', p.remarks || '', String(p.amount || ''), p.paid_at || p.created_at || ''
        ].join(' ').toLowerCase();
        return haystack.includes(q);
      });

      const tbody = document.getElementById('paymentsTable');
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-fuchsia-300/60 italic">${q || typeFilter !== 'all' || methodFilter !== 'all' ? 'No payments match your search/filter.' : 'No payment records found.'}</td></tr>`;
        updatePaymentCountLabel(0, payments.length, q, typeFilter, methodFilter);
        return;
      }

      tbody.innerHTML = list.map(p => {
        const typeBadge = p.type === 'fine'
          ? `<span class="px-2 py-1 rounded-full text-[10px] font-bold bg-red-500/20 text-red-300 border border-red-400/30">Fine</span>`
          : `<span class="px-2 py-1 rounded-full text-[10px] font-bold bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-400/30">Fee</span>`;
        const dateVal = p.paid_at || p.created_at;
        const dateStr = dateVal ? new Date(dateVal).toLocaleDateString() : '—';

        return `
          <tr class="hover:bg-fuchsia-900/30 transition-colors">
            <td class="py-3.5 px-4 font-semibold text-white">${p.student_name || '—'}</td>
            <td class="py-3.5 px-4">${typeBadge}</td>
            <td class="py-3.5 px-4 text-fuchsia-200 font-mono text-[11px]">${p.reference || '—'}</td>
            <td class="py-3.5 px-4 text-emerald-300 font-bold">₱${(parseFloat(p.amount) || 0).toFixed(2)}</td>
            <td class="py-3.5 px-4 text-fuchsia-200 capitalize">${p.method || '—'}</td>
            <td class="py-3.5 px-4 text-fuchsia-300/80">${dateStr}</td>
            <td class="py-3.5 px-4 text-right">
              <button onclick="deletePayment(${p.id})" class="p-1.5 rounded-lg text-fuchsia-400 hover:text-red-300 hover:bg-red-500/20 transition-all">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </td>
          </tr>
        `;
      }).join('');
      lucide.createIcons();
      updatePaymentCountLabel(list.length, payments.length, q, typeFilter, methodFilter);
    }

    function updatePaymentCountLabel(shown, total, q, typeFilter, methodFilter) {
      const label = document.getElementById('paymentCountLabel');
      if (!label) return;
      if (total === 0) {
        label.textContent = '';
      } else if (!q && typeFilter === 'all' && methodFilter === 'all') {
        label.textContent = `Showing all ${total} payment${total === 1 ? '' : 's'} (A–Z).`;
      } else {
        label.textContent = `Showing ${shown} of ${total} payment${total === 1 ? '' : 's'} (filtered).`;
      }
    }

    function clearPaymentSearch() {
      const input = document.getElementById('paymentSearch');
      if (input) input.value = '';
      renderPayments();
      input?.focus();
    }

    function setPaymentType(type) {
      paymentType = type;
      const feeBtn = document.getElementById('typeBtn-fee');
      const fineBtn = document.getElementById('typeBtn-fine');
      const active = 'bg-fuchsia-600 text-white border-fuchsia-400/50';
      const inactive = 'bg-fuchsia-950/60 text-fuchsia-300 border-fuchsia-500/30';

      feeBtn.className = `px-3 py-2.5 rounded-xl border text-xs font-bold transition-all flex items-center justify-center gap-2 ${type === 'fee' ? active : inactive}`;
      fineBtn.className = `px-3 py-2.5 rounded-xl border text-xs font-bold transition-all flex items-center justify-center gap-2 ${type === 'fine' ? active : inactive}`;
      document.getElementById('chargeTypeLabel').textContent = type === 'fee' ? 'Fee' : 'Fine';

      clearSelectedCharge();
      renderChargePicker('');
      lucide.createIcons();
    }

    function renderPayStudentPicker(query = '') {
      const listEl = document.getElementById('payStudentPickerList');
      if (!listEl) return;

      const q = (query || '').toLowerCase().trim();
      const matches = students.filter(s => !q || `${s.student_id || ''} ${s.first_name || ''} ${s.last_name || ''}`.toLowerCase().includes(q));

      if (students.length === 0) {
        listEl.innerHTML = `<div class="px-3 py-3 text-center text-fuchsia-300/60 italic">No students in ${ORG_LABEL}.</div>`;
        return;
      }
      if (matches.length === 0) {
        listEl.innerHTML = `<div class="px-3 py-3 text-center text-fuchsia-300/60 italic">No students match "${q}".</div>`;
        return;
      }

      listEl.innerHTML = matches.slice(0, 50).map(s => {
        const isSelected = selectedPayStudent && String(selectedPayStudent.id) === String(s.id);
        const initial = (s.first_name || 'S').charAt(0).toUpperCase();
        const fullName = `${s.first_name || ''} ${s.last_name || ''}`.trim();
        return `
          <button type="button" onclick='pickPayStudent(${JSON.stringify(s).replace(/'/g, "&#39;")})'
            class="w-full text-left px-3 py-2 flex items-center gap-2.5 hover:bg-fuchsia-800/40 transition-colors ${isSelected ? 'bg-fuchsia-700/40' : ''}">
            <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-fuchsia-600 to-fuchsia-400 border border-fuchsia-300/40 flex items-center justify-center font-bold text-[11px] text-white shrink-0">
              ${initial}
            </div>
            <div class="min-w-0 flex-1">
              <div class="font-semibold text-white truncate text-xs">${fullName || '—'}</div>
              <div class="text-[10px] text-fuchsia-300/70 font-mono truncate">${s.student_id || ''}</div>
            </div>
            ${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400 shrink-0"></i>' : ''}
          </button>
        `;
      }).join('');
      lucide.createIcons();
    }

    function pickPayStudent(s) {
      selectedPayStudent = s;
      document.getElementById('payment-student').value = s.id;
      const chip = document.getElementById('selectedPayStudentChip');
      const label = document.getElementById('selectedPayStudentLabel');
      label.textContent = `${s.student_id || ''} — ${s.first_name || ''} ${s.last_name || ''}`.trim();
      chip.classList.remove('hidden');
      document.getElementById('payStudentPickerSearch').value = '';
      clearSelectedCharge();
      renderChargePicker('');
      renderPayStudentPicker('');
    }

    function clearSelectedPayStudent() {
      selectedPayStudent = null;
      document.getElementById('payment-student').value = '';
      document.getElementById('selectedPayStudentChip').classList.add('hidden');
      document.getElementById('payStudentPickerSearch').value = '';
      renderPayStudentPicker('');
      clearSelectedCharge();
      renderChargePicker('');
    }

    function getChargePool() {
      const pool = paymentType === 'fee' ? openFees : openFines;
      if (!selectedPayStudent) return [];
      return pool.filter(c => String(c.student_id) === String(selectedPayStudent.id));
    }

    function renderChargePicker(query = '') {
      const listEl = document.getElementById('chargePickerList');
      if (!listEl) return;

      if (!selectedPayStudent) {
        listEl.innerHTML = `<div class="px-3 py-3 text-center text-fuchsia-300/60 italic">Select a student first.</div>`;
        return;
      }

      const q = (query || '').toLowerCase().trim();
      const pool = getChargePool();

      const matches = pool.filter(c => {
        if (!q) return true;
        const label = paymentType === 'fee' ? `${c.org || ''} ${c.amount || ''} ${c.due_date || ''}` : `${c.reason || ''} ${c.amount || ''} ${c.due_date || ''}`;
        return label.toLowerCase().includes(q);
      });

      if (pool.length === 0) {
        listEl.innerHTML = `<div class="px-3 py-3 text-center text-fuchsia-300/60 italic">No open ${paymentType === 'fee' ? 'fees' : 'fines'} for this student.</div>`;
        return;
      }
      if (matches.length === 0) {
        listEl.innerHTML = `<div class="px-3 py-3 text-center text-fuchsia-300/60 italic">No open charges match "${q}".</div>`;
        return;
      }

      listEl.innerHTML = matches.slice(0, 50).map(c => {
        const isSelected = selectedCharge && String(selectedCharge.id) === String(c.id);
        const title = paymentType === 'fee' ? (c.org || 'Membership Fee') : (c.reason || 'Fine');
        const meta = `₱${(parseFloat(c.amount) || 0).toFixed(2)}${c.due_date ? ' • due ' + new Date(c.due_date).toLocaleDateString() : ''}`;
        return `
          <button type="button" onclick='pickCharge(${JSON.stringify(c).replace(/'/g, "&#39;")})'
            class="w-full text-left px-3 py-2 flex items-center justify-between gap-2 hover:bg-fuchsia-800/40 transition-colors ${isSelected ? 'bg-fuchsia-700/40' : ''}">
            <div class="min-w-0">
              <div class="font-semibold text-white truncate text-xs">${title}</div>
              <div class="text-[10px] text-fuchsia-300/70 truncate">${meta}</div>
            </div>
            ${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400 shrink-0"></i>' : ''}
          </button>
        `;
      }).join('');
      lucide.createIcons();
    }

    function pickCharge(c) {
      selectedCharge = c;
      document.getElementById('payment-charge').value = c.id;
      const chip = document.getElementById('selectedChargeChip');
      const title = document.getElementById('selectedChargeTitle');
      const meta = document.getElementById('selectedChargeMeta');

      const chargeTitle = paymentType === 'fee' ? (c.org || 'Membership Fee') : (c.reason || 'Fine');
      title.textContent = chargeTitle;
      meta.textContent = `₱${(parseFloat(c.amount) || 0).toFixed(2)}${c.due_date ? ' • due ' + new Date(c.due_date).toLocaleDateString() : ''}`;
      chip.classList.remove('hidden');

      document.getElementById('payment-amount').value = (parseFloat(c.amount) || 0).toFixed(2);
      updatePaymentBalanceHint();
      document.getElementById('chargePickerSearch').value = '';
      renderChargePicker('');
    }

    function clearSelectedCharge() {
      selectedCharge = null;
      document.getElementById('payment-charge').value = '';
      document.getElementById('selectedChargeChip').classList.add('hidden');
      document.getElementById('payment-amount').value = '';
      updatePaymentBalanceHint();
    }

    function updatePaymentBalanceHint() {
      const hint = document.getElementById('paymentBalanceHint');
      if (!hint) return;
      if (!selectedCharge) { hint.textContent = ''; return; }
      const due = parseFloat(selectedCharge.amount) || 0;
      const paid = parseFloat(document.getElementById('payment-amount').value) || 0;
      const bal = Math.max(0, due - paid);
      hint.textContent = `Charge: ₱${due.toFixed(2)} • Balance after this payment: ₱${bal.toFixed(2)}`;
    }

    document.getElementById('payment-amount')?.addEventListener('input', updatePaymentBalanceHint);

    function openPaymentModal() {
      document.getElementById('paymentForm').reset();
      const dateInput = document.getElementById('payment-date');
      if (dateInput) dateInput.value = new Date().toISOString().slice(0, 10);

      paymentType = 'fee';
      setPaymentType('fee');
      clearSelectedPayStudent();
      clearSelectedCharge();
      renderPayStudentPicker('');
      renderChargePicker('');
      updatePaymentBalanceHint();
      document.getElementById('modal-payment').classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeModal(id) {
      const m = document.getElementById(id);
      if (m) m.classList.add('opacity-0', 'pointer-events-none');
    }

    async function savePayment(event) {
      event.preventDefault();
      if (!window.supabaseClient) return;
      if (!selectedPayStudent) { showToast('Missing Student', 'Search and select a student first.'); return; }
      if (!selectedCharge) { showToast('Missing Charge', `Select a ${paymentType === 'fee' ? 'fee' : 'fine'} to pay.`); return; }

      const amount = parseFloat(document.getElementById('payment-amount').value) || 0;
      if (amount <= 0) { showToast('Invalid Amount', 'Amount must be greater than zero.'); return; }

      const payload = {
        org: ORG_LABEL,
        student_id: selectedPayStudent.id,
        student_name: `${selectedPayStudent.first_name} ${selectedPayStudent.last_name}`,
        type: paymentType,
        charge_id: selectedCharge.id,
        charge_label: paymentType === 'fee' ? (selectedCharge.org || 'Membership Fee') : (selectedCharge.reason || 'Fine'),
        amount,
        method: document.getElementById('payment-method').value,
        paid_at: document.getElementById('payment-date').value || new Date().toISOString().slice(0, 10),
        reference: document.getElementById('payment-ref').value.trim() || null,
      };

      try {
        const { error } = await window.supabaseClient.from('payments').insert([payload]).select();
        if (error) { showToast('Save Failed ❌', error.message); return; }

        const due = parseFloat(selectedCharge.amount) || 0;
        if (amount >= due) {
          if (paymentType === 'fee') {
            await window.supabaseClient.from('fees').update({ status: 'paid' }).eq('id', selectedCharge.id);
          } else {
            await window.supabaseClient.from('fines').update({ status: 'settled' }).eq('id', selectedCharge.id);
          }
        }

        closeModal('modal-payment');
        await loadAll();
        showToast('Payment Recorded ✅', `${payload.student_name} — ₱${amount.toFixed(2)}`);
      } catch (err) { showToast('Save Failed', err.message); }
    }

    async function deletePayment(id) {
      if (!confirm('Delete this payment record?')) return;
      if (!window.supabaseClient) return;
      try {
        const { error } = await window.supabaseClient.from('payments').delete().eq('id', id);
        if (error) { showToast('Delete Failed ❌', error.message); return; }
        await loadPayments();
        showToast('Payment Deleted ✅', 'Record removed.');
      } catch (err) { showToast('Delete Failed', err.message); }
    }
  </script>
</body>
</html>
